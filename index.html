<title>מילון אנגלית לפי רמות</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: one screen at a time, like an app — levels → groups → group → quiz. One accent, lots of space. */
:root{
  --bg:#fbfaf8; --surface:#f2f1ee; --ink:#2b2f36; --muted:#6b707a; --line:#e6e3de;
  --accent:#4f7096; --accent-ink:#ffffff; --accent-soft:#edf1f6;
  --ok:#4c7f62; --ok-soft:#eef4ef; --bad:#a85a5a; --bad-soft:#f8eeed;
  --he:"Assistant",Arial,sans-serif; --en:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181b; --surface:#202328; --ink:#e9e7e3; --muted:#a3a8b0; --line:#2e3238;
  --accent:#9db6d4; --accent-ink:#15202d; --accent-soft:#232c37;
  --ok:#8fc2a3; --ok-soft:#1d2b23; --bad:#d9a0a0; --bad-soft:#33221f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181b; --surface:#202328; --ink:#e9e7e3; --muted:#a3a8b0; --line:#2e3238;
  --accent:#9db6d4; --accent-ink:#15202d; --accent-soft:#232c37;
  --ok:#8fc2a3; --ok-soft:#1d2b23; --bad:#d9a0a0; --bad-soft:#33221f; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--he);font-size:18px;line-height:1.55}
.app{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;min-height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:700}
.sub{color:var(--muted);margin:.35rem 0 0}
.screen{display:flex;flex-direction:column;gap:20px}

/* top nav */
.nav{display:flex;align-items:center;gap:8px;min-height:48px}
.nav .home-btn{margin-inline-start:auto}
.home-btn{border:0;background:var(--surface);color:var(--muted);width:40px;height:40px;border-radius:50%;cursor:pointer;flex:none;display:inline-grid;place-items:center;padding:0}.home-btn svg{width:20px;height:20px}
.search{margin:0;padding-inline-end:44px}.sbox{position:relative;margin:4px 0}.sclear{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font-size:1rem;cursor:pointer;padding:0}.sclear[hidden]{display:none}
.sticky .row2.quick{margin-top:8px}
.today{display:flex;flex-direction:column;gap:6px;width:100%;text-align:right;border:0;border-radius:16px;background:var(--accent-soft);padding:14px 16px;cursor:pointer;color:var(--ink);font:inherit}
.today .td-top{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted)}.today .td-hist{color:var(--accent);font-weight:700}
.today .td-num{font-size:1.05rem}.today .td-num b{font-size:1.5rem}.today.done{background:var(--ok-soft)}.today.done .bar2 i,.days li.done .bar2 i{background:var(--ok)}
.days{list-style:none;margin:0;padding:0}.days li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}.days .bar2{grid-column:1/-1;display:block;background:var(--surface)}.today .bar2{display:block}.days .dn{font-weight:700}.days li.done .dn{color:var(--ok)}
.totop{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;z-index:20;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--bg);font-size:1.4rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}.totop[hidden]{display:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
/* calm look: lighter weights, hairline borders, softer shadows */
.btn{font-weight:600;border-radius:12px;box-shadow:none}
.item,.panel,.today{border:1px solid var(--line);box-shadow:none}
.item{background:var(--bg)}.panel{background:var(--bg)}
.totop{background:var(--ink);opacity:.75}
/* word extras: tip / usage / my note / sentence translation */
.xtras{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.xbtn{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600;cursor:pointer}
.xbtn[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.xbtn.has::after{content:" •";color:var(--accent)}
.xbox{background:var(--surface);border-radius:12px;padding:12px 14px;font-size:.98rem;line-height:1.6}
.xbox b{display:block;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.xbox textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.trans{display:block;margin-top:6px;color:var(--muted);font-family:var(--he);font-size:.95rem;direction:rtl;text-align:right}
.scol{flex:1;min-width:0}.cardx{display:flex;flex-direction:column;gap:8px}.words .xtras{justify-content:flex-start;margin-top:6px}
.trbtn{border:0;background:none;color:var(--accent);font-size:.85rem;font-weight:600;padding:4px 0 0;cursor:pointer;display:block;margin-inline-start:auto}
#srchRes .words{margin-bottom:8px}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:10px 4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.back::before{content:"→";font-size:1.2em}

/* primary actions */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1rem;cursor:pointer;padding:12px 18px}
.btn.secondary{background:var(--surface);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* simple list rows */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;background:var(--surface);border:0;border-radius:14px;padding:16px 18px;min-height:64px;cursor:pointer}
.item .t{font-weight:700;font-size:1.1rem}
.item .d{color:var(--muted);font-size:.95rem}
.item .chev{color:var(--muted);font-size:1.3rem}
.item.done .d{color:var(--ok);font-weight:600}
.lbl{font-size:.95rem;color:var(--muted);font-weight:600;margin:0}

/* segmented control */
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:44px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* word list in a group */
.words{list-style:none;margin:0;padding:0}
.words li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.words .txt{flex:1;min-width:0}
.words .e{font-family:var(--en);font-weight:600;font-size:1.1rem;direction:ltr;text-align:right}
.words .h{color:var(--muted);font-size:.98rem}
.words li.ok .e::after{content:" ✓";color:var(--ok);font-family:var(--he)}
.spk{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.spk svg{width:20px;height:20px}
.no-tts .spk{display:none}
details.wl summary{cursor:pointer;color:var(--accent);font-weight:700;min-height:44px;display:flex;align-items:center}

/* quiz */
.qtop{display:flex;align-items:center;gap:14px}
.x{border:0;background:var(--surface);width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.1rem;flex:none}
.prog{flex:1;height:8px;background:var(--surface);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;flex:none}
.word{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 12px 28px;text-align:center}
.word .w{font-family:var(--en);font-weight:600;font-size:clamp(2rem,9vw,2.8rem);direction:ltr;line-height:1.15;overflow-wrap:anywhere}
.word .spk{width:52px;height:52px}
.ask{font-weight:700;margin:0}
.inp{width:100%;min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-size:1.15rem;padding:12px 16px}
.inp:focus{border-color:var(--accent);outline:none}
.mine{background:var(--surface);border-radius:12px;padding:12px 16px;margin:0}
.mine span{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:right;min-height:58px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 16px;font-size:1.08rem;cursor:pointer}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt:focus:not(:focus-visible){outline:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{margin:0;font-weight:700;font-size:1.1rem;text-align:center}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb:empty{display:none}

/* results */
.big{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.center{text-align:center}
.mist{list-style:none;margin:0;padding:0}
.mist li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mist .e{font-family:var(--en);font-weight:600;direction:ltr}
.mist .h{color:var(--muted);text-align:left}

/* flashcard */
.card{background:var(--surface);border:0;border-radius:18px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;cursor:pointer;width:100%}
.card .w{font-family:var(--en);font-weight:600;font-size:2.2rem;direction:ltr}
.card .a{font-size:1.25rem}
.card .hint{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.howto{color:var(--muted);font-size:.95rem}
.howto summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:44px;display:flex;align-items:center}
.howto ol{margin:0;padding-inline-start:20px}

/* mobile tuning */
html,body{height:100%}
button,.item,.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:active,.item:active,.opt:active:not(:disabled){transform:scale(.985)}
.sticky{position:sticky;bottom:0;z-index:3;display:flex;flex-direction:column;gap:10px;background:var(--bg);padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:auto}
.screen.full{min-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.qtop{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3;padding-block:8px}
.inp{font-size:max(16px,1.15rem)}
.mist li{flex-wrap:wrap}
.mist .h{text-align:right;flex-basis:100%}
@media (max-width:420px){
  body{font-size:17px}
  .app{padding-inline:16px;padding-block:12px 24px}
  h1{font-size:1.6rem} h2{font-size:1.35rem}
  .item{padding:14px 16px}
  .card{min-height:220px}
  .card .w{font-size:1.9rem}
}
@media (max-height:720px){
  .word{padding:14px 8px 10px;gap:10px}

const EXTRA={"and":{"tr":"קניתי לחם וחלב.","use":"מחבר בין שתי מילים או שני משפטים שווים. ברשימה של שלושה ומעלה שמים and רק לפני האחרון: bread, milk and eggs.","tip":"and נשמע כמו 'אֶנְד' – וחיבור, כמו ו' החיבור בעברית."},"of#0":{"tr":"היא חברה של אחותי.","use":"מציין שייכות או חלק משהו: a friend of mine, the end of the movie. בא בין שני שמות עצם.","tip":"of מקשר בין 'החלק' ל'שלם' – a cup of tea = כוס של תה."},"type#1":{"tr":"איזה סוג רכב יש לך?","use":"שם עצם. בדרך כלל בא אחריו of: a type of food. דומה ל-kind ול-sort.","tip":"type כמו 'טיפוס' בעברית – איזה טיפוס/סוג."},"in":{"tr":"המפתחות בתוך התיק שלי.","use":"מציין מיקום בתוך משהו (in the box), עיר/ארץ (in Paris), חודש/שנה (in May, in 2020).","tip":"in = בפנים, בתוך – כמו 'in' של כניסה (IN) בחניונים."},"that":{"tr":"אני יודעת שאת עייפה.","use":"מחבר משפט שני: I think that..., I know that.... בדיבור אפשר לפעמים להשמיט אותו: I know you are tired.","tip":"that מכניס משפט שלם, בדיוק כמו ש- בעברית: אני יודעת ש..."},"for#0":{"tr":"הוא נשאר בבית, כי הוא היה חולה.","use":"במשמעות 'כי, מפני ש-' זה סגנון ספרותי/רשמי, ובא אחרי פסיק באמצע משפט. בדיבור משתמשים ב-because.","tip":"for = 'בשביל' – הוא נשאר בבית בשביל (בגלל) שהיה חולה."},"rather than#1":{"tr":"היא אוהבת חתולים יותר מכלבים.","use":"משווה בין שתי אפשרויות ומעדיף את הראשונה. אחריו בא שם עצם או פועל באותה צורה כמו לפניו.","tip":"rather = 'דווקא' – דווקא חתולים, ולא כלבים."},"on":{"tr":"הספר על השולחן.","use":"מציין מיקום על משטח (on the table), ימים ותאריכים (on Monday, on May 5).","tip":"on כמו מתג ON – משהו שיושב 'על' הכפתור."},"with#0":{"tr":"היא גזרה את הנייר במספריים.","use":"במשמעות 'באמצעות' בא לפני הכלי שבעזרתו עושים משהו: write with a pen, cut with a knife.","tip":"with = 'עם' – גזרה עם מספריים, כלומר באמצעותם."},"post#3":{"tr":"הדואר מגיע כל בוקר בתשע.","use":"בבריטניה post = דואר (מכתבים). באמריקה אומרים בדרך כלל mail. post office = סניף דואר.","tip":"post office = בית הדואר. גם 'פוסטמן' הוא הדוור."},"as#0":{"tr":"היא שרה יפה כמו אמא שלה.","use":"במבנה as רוק ורחב."},"like#0":{"tr":"היא שרה כמו ציפור.","use":"במשמעות 'כמו' בא אחריו שם עצם: like a bird. לפני משפט שלם עדיף as.","tip":"like = 'לייק' – דומה ל..., כמו."},"about#0":{"tr":"זה ספר על בעלי חיים.","use":"talk/think/read about = לדבר/לחשוב/לקרוא על נושא מסוים.","tip":"about = 'על אודות' הנושא."},"up":{"tr":"החתול טיפס למעלה על העץ.","use":"מציין כיוון למעלה. בא אחרי פעלים רבים ומשנה את משמעותם: get up, give up, look up.","tip":"up כמו חץ ↑ – למעלה."},"what":{"tr":"מה השם שלך?","use":"מילת שאלה. what + שם עצם = איזה: What color?","tip":"what – 'וואט?' כשלא שומעים: מה?"},"when":{"tr":"תתקשרי אליי כשתגיעי הביתה.","use":"גם מילת שאלה (מתי?) וגם מחבר (כאשר). אחרי when על העתיד משתמשים בהווה: when you get home.","tip":"when ו-where וגם what – כל מילות השאלה מתחילות ב-wh."},"not... but…":{"tr":"היום לא קר אלא חם.","use":"מבנה של ניגוד: not X but Y = לא X אלא Y. שני החלקים באותה צורה דקדוקית.","tip":"not cold BUT warm – מוחקים את הראשון ושמים במקומו את השני."},"who#0":{"tr":"מי הבחורה ההיא?","use":"מילת שאלה על אנשים בלבד. על חפצים שואלים what.","tip":"who – 'הוּ?' מי שם?"},"rest#1":{"tr":"אכלתי תפוח אחד ונתתי לך את השאר.","use":"the rest (of) = השאר, היתר. בא תמיד עם the.","tip":"the rest – מה ש'נח' ונשאר בצד."},"there":{"tr":"שים את הקופסה שם.","use":"מציין מקום רחוק. גם במבנה there is / there are = יש.","tip":"here = כאן, there = שם. יש בה here + t."},"space#1":{"tr":"השאר רווח בין המילים.","use":"שם עצם: מקום פנוי בין דברים. במקלדת: space bar.","tip":"מקש ה-SPACE במקלדת יוצר רווח."},"which#0":{"tr":"זה הבית שקניתי.","use":"במשמעות 'אשר, ש-' מתייחס לחפצים ולבעלי חיים, לא לאנשים (לאנשים who).","tip":"which לדברים, who לאנשים."},"issue#1":{"tr":"הבנק הנפיק כסף חדש.","use":"פועל רשמי: להנפיק, להוציא (מסמכים, כסף, הודעה): issue a passport, issue a warning.","tip":"issue – 'מוציאים' משהו החוצה לציבור, כמו גיליון חדש."},"as if":{"tr":"הוא נראה כאילו ראה רוח רפאים.","use":"אחריו בא משפט שלם. בא לרוב אחרי look, sound, act, feel.","tip":"as if = 'כמו אם' – כאילו."},"force#1":{"tr":"עוצמת הרוח שברה את העץ.","use":"שם עצם: כוח פיזי. the air force = חיל האוויר.","tip":"May the force be with you – הכוח."},"time":{"tr":"אין לי זמן לדבר עכשיו.","use":"what time is it = מה השעה. have time = יש זמן. in time / on time = בזמן.","tip":"Time מגזין 'טיים' – זמן."},"just as":{"tr":"היא גבוהה בדיוק כמו אחיה.","use":"just as ... as = בדיוק באותה מידה כמו.","tip":"just = בדיוק, as = כמו."},"fine#1":{"tr":"יש לה שיער דק ורך.","use":"שם תואר: דק, עדין (שיער, חול, קו). שונה מ-fine במשמעות 'בסדר'.","tip":"fine line – קו דק."},"new":{"tr":"קיבלתי טלפון חדש.","use":"ההפך: old. brand new = חדש לגמרי.","tip":"New York – יורק החדשה."},"fire#2":{"tr":"החיילים ירו ברובים שלהם.","use":"פועל: לירות. fire at someone = לירות על מישהו.","tip":"אש יוצאת מהרובה כשיורים – fire."},"people":{"tr":"הרבה אנשים באו למסיבה.","use":"שם עצם ברבים (people are). היחיד: person.","tip":"פיפל – 'פופולרי' בא מאותו שורש, אהוב על אנשים."},"major#2":{"tr":"השיר בסולם דו מז'ור.","use":"מונח מוזיקה: סולם מז'ור (שמח). ההפך: minor.","tip":"major = 'גדול' – סולם מז'ור נשמע גדול ושמח."},"how":{"tr":"איך מכינים את העוגה הזאת?","use":"how much/many = כמה. how old = בן כמה. How are you = מה שלומך.","tip":"How are you? – איך את?"},"also":{"tr":"גם אני אוהבת מוזיקה.","use":"בא בדרך כלל לפני הפועל (I also like) או אחרי be (She is also...).","tip":"also = 'אולסו' – גם זה, וגם זה."},"now":{"tr":"אנחנו צריכים לצאת עכשיו.","use":"right now = ממש עכשיו. from now on = מעכשיו והלאה.","tip":"now – 'נאו', ההפך מ-then (אז)."},"project#1":{"tr":"אנחנו עובדים על פרויקט של בית הספר.","use":"שם עצם (ההטעמה בהברה הראשונה: PRO-ject). work on a project.","tip":"project = פרויקט, אותה מילה בעברית."},"all in all":{"tr":"בסך הכול, זה היה טיול טוב.","use":"בא בתחילת משפט כסיכום, ואחריו פסיק.","tip":"all in all – 'הכול בתוך הכול', סיכום של הכול."},"miss#1":{"tr":"פספסתי את האוטובוס הבוקר.","use":"miss the bus/train/chance = לפספס. גם להחטיא מטרה.","tip":"miss – 'מיס', החטאה, כמו בכדורסל."},"than":{"tr":"אחי מבוגר ממני.","use":"בא אחרי תואר בהשוואה: older than, better than, more than.","tip":"than בהשוואה, then בזמן – אל תתבלבלי."},"date#1":{"tr":"תמרים הם פירות מתוקים.","use":"שם עצם: הפרי תמר. כמעט תמיד בהקשר של אוכל.","tip":"date גם 'דייט' – ותמרים מתוקים כמו דייט טוב."},"in order to":{"tr":"היא לומדת קשה כדי לעבור את המבחן.","use":"אחריו בא פועל בצורת הבסיס: in order to pass. מבטא מטרה, כמו to.","tip":"in order = 'בסדר' – כדי שהדברים יסתדרו."},"because of":{"tr":"המשחק הופסק בגלל הגשם.","use":"אחריו בא שם עצם (because of the rain). אחרי because לבד בא משפט שלם.","tip":"because of + דבר, because + משפט."},"account#1":{"tr":"פתחתי חשבון בנק.","use":"bank account = חשבון בנק. גם חשבון משתמש באתר.","tip":"account – חשבון שבו 'סופרים' (count) את הכסף."},"only":{"tr":"יש לי רק אחות אחת.","use":"בא בדרך כלל לפני המילה שהוא מגביל. an only child = ילד יחיד.","tip":"only – 'אונלי', קשור ל-one: רק אחד."},"after":{"tr":"יצאנו לטיול אחרי ארוחת הערב.","use":"ההפך: before. afterwards = אחר כך.","tip":"after-party – המסיבה של אחרי."},"position#1":{"tr":"שבי בתנוחה נוחה.","use":"שם עצם: האופן שבו הגוף מונח או עומד.","tip":"position = פוזיציה, תנוחה."},"into":{"tr":"הוא קפץ לתוך הבריכה.","use":"מציין תנועה פנימה (in + to). אחרי פעלי תנועה: go/jump/walk into.","tip":"in + to = אל תוך."},"1st - first":{"tr":"זו הפעם הראשונה שלי בלונדון.","use":"מספר סודר. בא עם the: the first day. at first = בהתחלה.","tip":"first = 1st – מקום ראשון."},"period#1":{"tr":"לירח יש מחזור של כחודש.","use":"במשמעות מחזור: זמן שחוזר על עצמו. גם מחזור חודשי.","tip":"period – פרק זמן שחוזר שוב ושוב."},"in the same way":{"tr":"נסו לענות באותו אופן כמו קודם.","use":"in the same way as = באותה דרך כמו.","tip":"same = אותו, way = דרך."},"record#1":{"tr":"הוא שבר את שיא העולם.","use":"שם עצם (RE-cord): שיא. break a record = לשבור שיא. world record = שיא עולם.","tip":"רקורד – 'שבר רקורד' בעברית."},"know, knew|know":{"tr":"אני יודעת את מספר הטלפון שלה.","use":"פועל בהווה. העבר: knew. ה-k בתחילת המילה לא נשמעת.","tip":"know – ה-k שקטה, 'אני יודעת' ולא צריכה להגיד."},"just as… so…":{"tr":"בדיוק כמו שאת צריכה אוכל, כך צמחים צריכים מים.","use":"מבנה השוואה רשמי: Just as X, so Y.","tip":"just as = בדיוק כמו, so = כך גם."},"first of all":{"tr":"קודם כול, תנו לי להגיד תודה.","use":"בא בתחילת משפט כדי לפתוח רשימה של נקודות, ואחריו פסיק.","tip":"first of all – הראשון מכולם."},"common#1":{"tr":"יש לנו חבר משותף.","use":"in common = במשותף: We have a lot in common.","tip":"common = 'קומון', כמו קומונה – של כולם ביחד."},"over#0":{"tr":"מטוס טס מעל העיר.","use":"מציין מעל משהו, לעיתים עם תנועה מעל או לרוחב.","tip":"over – כמו גשר שעובר מעל."},"think, thought|think":{"tr":"אני חושבת שירד גשם היום.","use":"think about = לחשוב על. think that = לחשוב ש-. העבר: thought.","tip":"think – 'תינק', דמייני טנק של מחשבות בראש."},"perfect#1":{"tr":"מזג האוויר היום מושלם.","use":"שם תואר: מושלם, בלי פגם.","tip":"perfect = פרפקט, מושלם."},"then":{"tr":"אכלנו, ואז ראינו סרט.","use":"מציין את השלב הבא או זמן בעבר. אל תתבלבלי עם than (מ-, בהשוואה).","tip":"then – when ו-then: מתי? ואז."},"in light of":{"tr":"לאור הסערה, הטיול בוטל.","use":"ביטוי רשמי: בהתחשב ב-. אחריו בא שם עצם.","tip":"in light of – 'באור של' העובדה, לאור."},"from time to time":{"tr":"אני מבקרת את סבתא שלי מדי פעם.","use":"בא בתחילת או בסוף המשפט. דומה ל-sometimes.","tip":"from time to time – מפעם לפעם, מילה במילה."},"by now":{"tr":"עד עכשיו היא כבר אמורה להיות בבית.","use":"מתאר משהו שכבר אמור היה לקרות עד הרגע הזה.","tip":"by = עד, now = עכשיו."},"of#1":{"tr":"השולחן עשוי מעץ.","use":"made of = עשוי מ- (החומר עדיין נראה). made from = כשהחומר השתנה.","tip":"made of wood – העץ הוא החומר שממנו עשוי."},"in front of":{"tr":"המכונית עצרה מול הבית.","use":"ההפך: behind. שימי לב: in front of = מול/לפני, לא 'מול' במובן של בצד השני.","tip":"front = חזית, in front of – בחזית של."},"for the sake of":{"tr":"הוא הפסיק לעשן למען הבריאות שלו.","use":"אחריו בא שם עצם: for the sake of the children.","tip":"sake נשמע כמו 'סייק' – לטובת מישהו."},"want":{"tr":"אני רוצה כוס מים.","use":"want + שם עצם, או want to + פועל: I want to go. לא אומרים want that.","tip":"want – 'וונט', רוצה ומחכה למשהו."},"for#1":{"tr":"קניתי מתנה לאמא שלי.","use":"מציין למי מיועד משהו: a gift for you.","tip":"for you – בשבילך."},"on top of":{"tr":"החתול ישב על גג המכונית.","use":"על החלק העליון של. גם 'בנוסף ל-': on top of that.","tip":"top = הפסגה, on top of – על הפסגה של."},"because":{"tr":"נשארתי במיטה כי הייתי חולה.","use":"אחריו בא משפט שלם. לפני שם עצם: because of.","tip":"because – 'ביקוז', ענה ל-why."},"with#1":{"tr":"הלכתי לפארק עם החברים שלי.","use":"מציין חברה או יחד: with my friends. ההפך: without.","tip":"with = עם, without = בלי."},"post#4":{"tr":"הצבא הציב חיילים בשער.","use":"פועל: להציב או למנות מישהו לתפקיד או למקום.","tip":"post – עמדה; מציבים מישהו בעמדה שלו."},"in a word":{"tr":"במילה אחת, הסרט היה משעמם.","use":"בא בתחילת משפט לסיכום קצר, ואחריו פסיק.","tip":"in a word – בתוך מילה אחת."},"as#1":{"tr":"כשפתחתי את הדלת, הטלפון צלצל.","use":"במשמעות 'כאשר' מתאר שני דברים שקורים באותו זמן.","tip":"as = בזמן ש..., כמו while."},"for the most part":{"tr":"בדרך כלל, התלמידים הצליחו.","use":"בא בתחילת משפט, ואחריו פסיק. דומה ל-mostly.","tip":"the most part – החלק הגדול ביותר."},"well#0":{"tr":"הם שאבו מים מהבאר הישנה.","use":"שם עצם: באר. משמעות שונה לגמרי מ-well (טוב).","tip":"well – דמייני דלי יורד לבאר עמוקה."},"by#1":{"tr":"הבית שלנו ליד הנהר.","use":"במשמעות 'ליד' בא לפני מקום: by the sea, by the window.","tip":"stand by me – תעמדי לידי."},"not only":{"tr":"היא לא רק שרה, היא גם רוקדת.","use":"בדרך כלל not only ... but also. בתחילת משפט מגיע היפוך: Not only does she...","tip":"not only – 'לא רק' זה, יש עוד."},"but#1":{"tr":"רציתי ללכת, אבל ירד גשם.","use":"מחבר שני משפטים עם ניגוד, ובא בדרך כלל אחרי פסיק.","tip":"but – 'באט', עוצר וגם הופך את הכיוון."},"in a moment":{"tr":"אהיה מוכנה בעוד רגע.","use":"מתאר משהו שיקרה מהר מאוד בעתיד.","tip":"moment = רגע."},"at first":{"tr":"בהתחלה לא אהבתי את העיר.","use":"מתאר מצב בהתחלה שהשתנה אחר כך. שונה מ-first of all.","tip":"at first – 'בראשון', בהתחלה."},"way":{"tr":"זו הדרך הנכונה לחוף?","use":"גם דרך פיזית (the way to) וגם אופן (the way you do it). by the way = אגב.","tip":"No way! – אין מצב, אין דרך."},"so#1":{"tr":"אני כל כך שמחה לראות אותך!","use":"במשמעות 'כל כך' בא לפני תואר: so happy, so big.","tip":"sooo happy – כמה שמושכים את ה-o, יותר 'כל כך'."},"both... and…":{"tr":"היא מדברת גם אנגלית וגם צרפתית.","use":"both X and Y = גם X וגם Y. שני החלקים באותה צורה דקדוקית.","tip":"both = שניהם."},"where#0":{"tr":"איפה את גרה?","use":"מילת שאלה על מקום. גם מחבר: the house where I live.","tip":"where יש בתוכה here – כאן? איפה?"},"most#0":{"tr":"זה המקום הכי יפה שאני מכירה.","use":"the most + תואר ארוך = הכי: the most beautiful. בתארים קצרים: -est (the biggest).","tip":"most – הכי הרבה, המקסימום."},"just#1":{"tr":"כולם חושבים שהחוק החדש צודק והוגן.","use":"שם תואר: הוגן. קשור ל-justice.","tip":"just = justice – צדק."},"even#0":{"tr":"אפילו אחי הקטן יודע את התשובה.","use":"מדגיש משהו מפתיע. בא לפני המילה שהוא מדגיש.","tip":"even – 'איבן', אפילו הוא!"},"like#1":{"tr":"אני אוהבת גלידת שוקולד.","use":"פועל: like + שם עצם או like + -ing: I like swimming. would like = הייתי רוצה.","tip":"לייק בפייסבוק – משהו שאני מחבבת."},"here":{"tr":"בואי לכאן, בבקשה.","use":"מציין מקום קרוב. Here you are = הנה, קחי.","tip":"here – 'הִיר', יש בה 'ear' – אוזן, כאן קרוב."},"about#1":{"tr":"היו בערך עשרים אנשים במסיבה.","use":"במשמעות 'בערך' בא לפני מספר או כמות: about ten minutes.","tip":"about 20 – 'בסביבות' עשרים."},"after all":{"tr":"אחרי הכול, הוא רק ילד.","use":"מזכיר סיבה חשובה. בתחילת או בסוף משפט.","tip":"after all – אחרי שלוקחים בחשבון הכול."},"need":{"tr":"אני צריכה עוד זמן.","use":"need + שם עצם או need to + פועל: I need to go. גם שם עצם: a need.","tip":"need – 'ניד', משהו שחייבים."},"right#0":{"tr":"פני ימינה בפינה.","use":"turn right = לפנות ימינה. ההפך: left. right גם 'נכון'.","tip":"right hand – היד הימנית."},"next to":{"tr":"הבנק ליד המאפייה.","use":"צמוד ממש. דומה ל-beside.","tip":"next – הבא בתור, צמוד לידו."},"work":{"tr":"אבא שלי נוסע לעבודה באוטובוס.","use":"גם פועל (I work) וגם שם עצם (at work). שם עצם לא ספיר: no 'a work'.","tip":"work – 'וורק', ובעבודה עובדים."},"who#1":{"tr":"האיש שגר בדירה הסמוכה הוא רופא.","use":"במשמעות 'ש-' מתייחס לאנשים בלבד: the man who...","tip":"who לאנשים, which לחפצים."},"too#0":{"tr":"הקפה הזה חם מדי לשתייה.","use":"too + תואר = יותר מדי (שלילי). too + תואר + to + פועל.","tip":"too יש שני o – יותר מדי o."},"being that":{"tr":"מכיוון שהיה מאוחר, הלכנו הביתה.","use":"ביטוי פחות רשמי, כמו since או because. בא בתחילת משפט.","tip":"being that – 'בהיות ש'... כך זה, ולכן."},"which#1":{"tr":"איזה צבע את רוצה?","use":"שאלה על בחירה מתוך כמה אפשרויות ידועות. which one = איזה מהם.","tip":"which – 'וויץ'', איזה מבין האפשרויות?"},"issue#2":{"tr":"זיהום הוא נושא חשוב.","use":"שם עצם: סוגיה, בעיה לדיון. an important issue.","tip":"issue – 'אישיו', הנושא שעל הפרק."},"before":{"tr":"שטפי ידיים לפני שאת אוכלת.","use":"לפני בזמן או במקום. ההפך: after.","tip":"before – 'ביפור', לפני ארבע (four)."},"why":{"tr":"למה את בוכה?","use":"מילת שאלה. עונים עליה ב-because.","tip":"why – Y, כמו האות שנשמעת כמו 'ווי' – למה?"},"as well as":{"tr":"יש לה כלב וגם שני חתולים.","use":"דומה ל-and, בא בין שני דברים: X as well as Y.","tip":"as well – גם כן."},"fine#2":{"tr":"אני מרגישה טוב, תודה.","use":"I'm fine = אני בסדר. a fine day = יום מצוין.","tip":"I'm fine – הכול טוב."},"still#0":{"tr":"מאוחר, אבל הוא עדיין עובד.","use":"במשמעות 'עדיין' בא לפני הפועל או אחרי be: still working.","tip":"still – 'סטיל', ממשיך עדיין לעמוד."},"made":{"tr":"היא הכינה עוגה ליום ההולדת שלי.","use":"עבר של make. made in = תוצרת: made in China.","tip":"Made in Israel – נעשה בישראל."},"never":{"tr":"אני אף פעם לא אוכלת בשר.","use":"בא לפני הפועל. לא משתמשים בו עם not נוסף.","tip":"never = not ever – אף פעם לא."},"once in a while":{"tr":"אנחנו הולכים לחוף מדי פעם.","use":"בא בסוף או בתחילת משפט. דומה ל-sometimes.","tip":"once = פעם אחת, in a while = בתוך זמן מה."},"of course… but…":{"tr":"כמובן שזה קשה, אבל את יכולה לעשות את זה.","use":"מודים בעובדה ואז מוסיפים ניגוד: Of course X, but Y.","tip":"קודם מסכימים (of course), ואז ה-but מגיע."},"project#2":{"tr":"הם הקרינו את הסרט על הקיר.","use":"פועל (pro-JECT, הטעמה בסוף): להקרין, להטיל. projector = מקרן.","tip":"projector – המקרן בכיתה מקרין (project) על הקיר."},"even so":{"tr":"ירד גשם. אף על פי כן, יצאנו.","use":"בא בתחילת משפט חדש, ואחריו פסיק. דומה ל-nevertheless.","tip":"even so – 'אפילו כך', ובכל זאת."},"down":{"tr":"הוא ירד במדרגות.","use":"מציין כיוון למטה. ההפך: up. sit down = לשבת.","tip":"down כמו חץ ↓ – למטה."},"date#2":{"tr":"הם יצאו לדייט בקולנוע.","use":"go on a date = לצאת לדייט. גם פועל: date someone = לצאת עם מישהו.","tip":"date – דייט, אותה מילה בעברית."},"great":{"tr":"היה לנו כיף גדול במסיבה.","use":"גם 'גדול' (a great city) וגם 'מעולה' (great!). Great Britain.","tip":"Great! – מעולה! אלכסנדר הגדול = Alexander the Great."},"as many as":{"tr":"באו לא פחות מחמישים איש.","use":"מדגיש מספר גדול. לפני שמות עצם ספירים. לכמות לא ספירה: as much as.","tip":"as many as 50 – 'אפילו' חמישים, הרבה!"},"even if":{"tr":"אני אלך גם אם ירד גשם.","use":"אחריו בא משפט שלם. מדגיש שהתנאי לא ישנה את התוצאה.","tip":"even = אפילו, if = אם – אפילו אם."},"through":{"tr":"הלכנו דרך הפארק.","use":"מצד אחד לצד השני של משהו: through the door/the window/the city.","tip":"through – 'ת'רו', עוברים מבעד למנהרה מקצה לקצה."},"position#2":{"tr":"היא קיבלה תפקיד חדש בחברה.","use":"שם עצם רשמי: משרה, תפקיד. apply for a position = להגיש מועמדות.","tip":"position – העמדה שלך בעבודה."},"last#0":{"tr":"זה העמוד האחרון בספר.","use":"the last = האחרון. last week = בשבוע שעבר.","tip":"last – 'לאסט', ה-least, האחרון בתור."},"while":{"tr":"היא קראה ספר בזמן שאני בישלתי.","use":"שני דברים שקורים באותו זמן. בא לרוב עם -ing: while cooking.","tip":"while – 'וואייל', כל הזמן שבינתיים."},"period#2":{"tr":"שימי נקודה בסוף המשפט.","use":"באנגלית אמריקאית period = נקודה בסוף משפט. בבריטית: full stop.","tip":"period – הנקודה שמסיימת 'תקופה' של משפט."},"as long as":{"tr":"את יכולה להישאר כמה שאת רוצה.","use":"גם 'כל עוד' (תנאי) וגם 'כל זמן ש-'. אחריו בא משפט שלם.","tip":"as long as – 'כל עוד', כל עוד זה ארוך."},"record#2":{"tr":"הרופא שומר תיעוד של כל ביקור.","use":"שם עצם (RE-cord): רשומה, תיעוד. keep a record of.","tip":"record – מה שנרשם ונשמר."},"as a result":{"tr":"הוא לא למד. כתוצאה מכך, הוא נכשל.","use":"בא בתחילת משפט חדש עם פסיק. as a result of + שם עצם.","tip":"result – תוצאה."},"know, knew|knew":{"tr":"ידעתי את התשובה.","use":"זמן עבר של know. ה-k שקטה: נשמע 'ניו'.","tip":"knew נשמע כמו new – ידעתי משהו חדש."},"best":{"tr":"היא החברה הכי טובה שלי.","use":"דרגה עליונה של good: good – better – best. בא עם the.","tip":"best friend – החבר הכי טוב."},"on one hand… on the other hand":{"tr":"מצד אחד זה זול; מצד שני זה איטי.","use":"מציג שני צדדים של עניין. החלק השני מתחיל ב-on the other hand.","tip":"דמייני שתי ידיים – יד אחת ויד שנייה."},"over#1":{"tr":"טעיתי, אז התחלתי מחדש.","use":"start over / do it over = להתחיל או לעשות שוב מההתחלה.","tip":"game over – נגמר, מתחילים מחדש."},"thanks to":{"tr":"בזכות העזרה שלך, סיימתי בזמן.","use":"מציין סיבה חיובית. אחריו בא שם עצם.","tip":"thanks = תודה – תודות ל..."},"of course":{"tr":"כמובן שאתם יכולים לבוא איתנו.","use":"מסכים באופן ברור. Of course! = בטח!","tip":"of course – 'כמובן', ברור שכן."},"think, thought|thought":{"tr":"חשבתי עלייך אתמול.","use":"עבר של think. גם שם עצם: a thought = מחשבה.","tip":"thought – בעבר חשבתי (think → thought)."},"in favor of":{"tr":"רוב האנשים הצביעו בעד התוכנית.","use":"be in favor of = לתמוך ב-. ההפך: against.","tip":"favor – טובה; לטובת משהו, בעדו."},"not only... but also…":{"tr":"הוא לא רק חכם אלא גם נחמד.","use":"מוסיף מידע מפתיע. שני החלקים באותה צורה דקדוקית.","tip":"לא רק זה – but also – אלא גם זה."},"in that case":{"tr":"את חולה? במקרה כזה, תישארי בבית.","use":"מגיב למידע שנאמר: אם כך. בתחילת משפט עם פסיק.","tip":"that case – המקרה ההוא שאמרת."},"in case":{"tr":"קחי מטרייה למקרה שירד גשם.","use":"בשביל להתכונן לאפשרות. אחריו בא משפט בהווה.","tip":"in case – 'ליתר ביטחון', למקרה ש..."},"use#0":{"tr":"מה התועלת בכלי הזה?","use":"שם עצם (ה-s נשמעת s): use. It's no use = אין טעם.","tip":"use – השימוש של משהו, למה הוא טוב."},"at last":{"tr":"סוף סוף האוטובוס הגיע.","use":"מבטא הקלה אחרי המתנה ארוכה. שונה מ-at the end.","tip":"at last – 'באחרון', סוף סוף."},"both":{"tr":"שני ההורים שלי מורים.","use":"both of + רבים / both + שם עצם ברבים. הפועל ברבים.","tip":"both – 'בות'', שניים יחד."},"post#5":{"tr":"הוא קיבל משרה חדשה בבנק.","use":"שם עצם רשמי: משרה, תפקיד.","tip":"post – העמדה שלך, הפוסט."},"such as":{"tr":"אני אוהבת פירות כמו תפוחים ובננות.","use":"מביא דוגמאות. אחריו שמות עצם, בלי פסיק לפניו לרוב.","tip":"such as – 'כגון'."},"in contrast to":{"tr":"בניגוד לאחיו, הוא שקט מאוד.","use":"משווה בין שני דברים שונים. אחריו בא שם עצם.","tip":"contrast – ניגוד (קונטרסט)."},"due to":{"tr":"הטיסה איחרה בגלל מזג אוויר גרוע.","use":"רשמי יותר מ-because of. אחריו בא שם עצם.","tip":"due to – 'הודות ל' (גם לדברים רעים)."},"well#1":{"tr":"היא מדברת אנגלית טוב מאוד.","use":"תואר הפועל של good: She sings well (לא good).","tip":"Well done! – עשית טוב!"},"by#2":{"tr":"המכתב נכתב על ידי סבא שלי.","use":"בסביל (passive): written by, made by.","tip":"by – 'בידי' מישהו."},"part":{"tr":"זה החלק הכי טוב בסרט.","use":"part of = חלק מ-. take part in = להשתתף ב-.","tip":"part – 'פרט', חתיכה מהשלם."},"in order":{"tr":"ודאי שהדרכון שלך תקין.","use":"in order = מסודר, תקין. out of order = מקולקל.","tip":"order = סדר – הכול בסדר."},"state#0":{"tr":"הבית במצב רע.","use":"שם עצם: מצב (של דבר או אדם): in a good state.","tip":"state – הסטטוס, איך זה עומד."},"in general":{"tr":"באופן כללי, אני אוהבת מזג אוויר קר.","use":"בתחילת משפט עם פסיק. דומה ל-generally.","tip":"general – כללי (גנרלי)."},"to begin with":{"tr":"בתור התחלה, אנחנו צריכים תוכנית.","use":"פותח רשימה של נקודות או מציין את הדבר הראשון.","tip":"begin = להתחיל."},"around#0":{"tr":"הלכנו מסביב לאגם.","use":"מסביב, בכל הכיוונים: around the world.","tip":"around – 'ראונד', סיבוב."},"where#1":{"tr":"יש אנשים שאוהבים את השמש, בעוד שאחרים אוהבים את הגשם.","use":"שימוש נדיר וספרותי, כמו whereas. מחבר שני משפטים מנוגדים.","tip":"where – כאן זה כך, ובמקום אחר אחרת."},"between":{"tr":"הכדור בין שני הכיסאות.","use":"בין שניים. בין יותר משניים לרוב among.","tip":"between – 'ביטווין', two בפנים: בין שניים."},"most#1":{"tr":"רוב התלמידים עברו את המבחן.","use":"most + רבים בלי the: most people. most of the + שם עצם.","tip":"most – רובם, הכי הרבה מהם."},"just#2":{"tr":"אני רק רוצה כוס מים.","use":"במשמעות 'רק' בא לפני הפועל או שם העצם: just one.","tip":"just – 'ג'אסט', רק זה."},"so long as":{"tr":"את יכולה לשחק כל עוד את מסיימת את שיעורי הבית.","use":"תנאי: רק אם. כמו as long as.","tip":"so long as – כל עוד, בתנאי ש."},"even#1":{"tr":"שתיים, ארבע ושש הם מספרים זוגיים.","use":"even number = מספר זוגי. ההפך: odd number.","tip":"even – 'שווה', מתחלק לשני חלקים שווים."},"always":{"tr":"היא תמיד שותה תה בבוקר.","use":"בא לפני הפועל: always drinks, ואחרי be: is always.","tip":"always – 'אול ווייז', כל הדרכים, כל הזמן."},"every now and then":{"tr":"מדי פעם אנחנו הולכים לקולנוע.","use":"לפעמים, לא בקביעות.","tip":"every now and then – כל עכשיו ואז."},"better":{"tr":"האנגלית שלך טובה יותר משלי.","use":"השוואה של good: better than. גם של well.","tip":"better – בטר, יותר טוב."},"find":{"tr":"אני לא מוצאת את המפתחות שלי.","use":"עבר: found. find out = לגלות.","tip":"find – 'פיינד', מצאתי! fine!"},"right#1":{"tr":"לכל אחד יש את הזכות ללמוד.","use":"have the right to = זכות ל-. human rights = זכויות אדם.","tip":"right – מה שנכון ומגיע לך."},"since#0":{"tr":"אני גרה כאן מאז 2010.","use":"since + נקודת זמן (since 2010). for + משך זמן (for 5 years).","tip":"since – 'סינס', מאז."},"as far as":{"tr":"ככל שאני יודעת, החנות סגורה.","use":"as far as I know = למיטב ידיעתי. as far as X is concerned = לגבי X.","tip":"far – רחוק; עד כמה שמגיע הידע שלי."},"in fact":{"tr":"הוא נראה צעיר, אבל למעשה הוא בן חמישים.","use":"מוסיף עובדה, לרוב מפתיעה. בתחילת משפט או באמצעו.","tip":"fact – עובדה; בפועל, בעובדה."},"too#1":{"tr":"אני אוהבת פיצה, וגם אחותי אוהבת.","use":"במשמעות 'גם' בא בסוף המשפט. me too = גם אני.","tip":"me too – גם אני."},"another":{"tr":"אפשר לקבל עוד עוגייה?","use":"an + other: עוד אחד, או אחר. בא עם יחיד: another day.","tip":"another = an + other, עוד אחד."},"own":{"tr":"יש לה חדר משלה.","use":"my own = משלי. on my own = לבד. גם פועל: own = להיות בעלים.","tip":"own – 'אוֹן', שלי בלבד."},"under":{"tr":"הכלב ישן מתחת לשולחן.","use":"מתחת. ההפך: over/above. under 18 = מתחת לגיל 18.","tip":"under – 'אנדר', underground = מתחת לאדמה."},"during":{"tr":"נרדמתי במהלך הסרט.","use":"during + שם עצם (during the movie). while + משפט.","tip":"during – 'דיורינג', במשך."},"instead of":{"tr":"אני שותה תה במקום קפה.","use":"אחריו שם עצם או -ing: instead of going.","tip":"instead – 'אינסטד', במקום."},"still#1":{"tr":"המבחן היה קשה. ובכל זאת, עברתי אותו.","use":"בתחילת משפט עם פסיק: בכל זאת.","tip":"still – 'עדיין' עומד, למרות הכול."},"house#0":{"tr":"הבניין הזה ישכן חמישים משפחות.","use":"פועל (ה-s נשמעת z): לשכן, לתת מקום מגורים.","tip":"house = בית, וכפועל – לתת בית."},"place":{"tr":"זה מקום נחמד לגור בו.","use":"גם שם עצם (מקום) וגם פועל (להניח, למקם). take place = להתקיים.","tip":"place – 'פלייס', מקום."},"school":{"tr":"הבן שלי הולך ברגל לבית הספר.","use":"go to school (בלי the) = ללמוד בבית ספר.","tip":"school – 'סקול', ובבית הספר לומדים."},"again":{"tr":"בבקשה תגיד את זה שוב.","use":"בא בסוף המשפט. again and again = שוב ושוב.","tip":"again – 'אגיין', עוד פעם."},"in due time":{"tr":"תביני בבוא הזמן.","use":"ביטוי רשמי: בזמן המתאים, לא עכשיו.","tip":"due – הזמן שמגיע; כשיגיע הזמן."},"next":{"tr":"ניפגש שוב בשבוע הבא.","use":"next week/year בלי the. next to = ליד.","tip":"Next! – הבא בתור!"},"without":{"tr":"אני לא רואה בלי המשקפיים שלי.","use":"ההפך של with. without + -ing: without saying.","tip":"with = עם, without = בלי."},"as soon as":{"tr":"תתקשרי אליי ברגע שתגיעי.","use":"מיד כש-. אחריו הווה גם על העתיד.","tip":"soon = בקרוב; כמה שיותר מהר כש..."},"as proof of":{"tr":"הוא נתן לה טבעת כהוכחה לאהבתו.","use":"proof = הוכחה. אחריו בא שם עצם.","tip":"proof – 'פרוף', הוכחה."},"not to mention":{"tr":"החדר קטן, שלא לדבר על כך שהוא חשוך.","use":"מוסיף עוד דבר שמחזק את הטענה.","tip":"mention = להזכיר; בלי להזכיר אפילו..."},"against":{"tr":"הוא נשען על הקיר.","use":"צמוד ל-, או נגד: against the wall, against the law.","tip":"against – 'אגיינסט', נגד."},"last#1":{"tr":"הפגישה נמשכה שעתיים.","use":"פועל: להימשך, להחזיק מעמד. last for + זמן.","tip":"last – מחזיק עד האחרון (last)."},"must":{"tr":"את חייבת לחגור חגורת בטיחות.","use":"must + פועל בסיס (בלי to). must not = אסור.","tip":"must – 'מאסט', חובה."},"found#0":{"tr":"מצאתי את המפתחות שאיבדתי.","use":"עבר של find.","tip":"find → found, מצאתי."},"record#3":{"tr":"המדען תיעד כל תוצאה במחברת.","use":"פועל (re-CORD): לרשום, לתעד. גם להקליט.","tip":"record – לשמור משהו שלא יישכח."},"show#0":{"tr":"ראינו תוכנית מצחיקה בטלוויזיה.","use":"שם עצם: הופעה, תוכנית. a TV show.","tip":"show – שואו, הופעה."},"on the contrary":{"tr":"הוא לא עצלן. להפך, הוא עובד קשה מאוד.","use":"מתקן משהו שנאמר: זה בדיוק ההפך.","tip":"contrary – הפוך."},"led to":{"tr":"הגשם הכבד גרם להצפות.","use":"עבר של lead to = להוביל ל-, לגרום ל-.","tip":"led – 'הוביל' את הדרך אל..."},"feel":{"tr":"אני מרגישה שמחה היום.","use":"feel + תואר: feel good. feel like = להתחשק.","tip":"feel – 'פיל', מרגישים."},"team":{"tr":"הקבוצה שלנו ניצחה במשחק.","use":"קבוצה בספורט או בעבודה. teamwork = עבודת צוות.","tip":"team – 'טים', צוות."},"family":{"tr":"המשפחה שלי גדולה מאוד.","use":"שם עצם יחיד. family name = שם משפחה.","tip":"family – פמיליה, משפחה."},"keep#0":{"tr":"בבקשה שמרי את הסוד הזה.","use":"keep + שם עצם = לשמור. keep + -ing = להמשיך: keep going.","tip":"keep – 'קיפ', להחזיק אצלך."},"in spite of":{"tr":"למרות הגשם, שיחקנו בחוץ.","use":"אחריו שם עצם. כמו despite.","tip":"spite – 'למרות' (כמו בעברית: להכעיס)."},"money":{"tr":"אין לי מספיק כסף.","use":"שם עצם לא ספיר: much money, not many money.","tip":"money – 'מאני', כסף."},"in other words":{"tr":"הוא זהיר מאוד; במילים אחרות, הוא איטי.","use":"מסביר שוב במילים פשוטות יותר.","tip":"other words – מילים אחרות."},"2nd - second":{"tr":"היא הגיעה שנייה במרוץ.","use":"מספר סודר: second. גם 'שנייה' של זמן.","tip":"2nd – השני, אחרי הראשון."},"left":{"tr":"פני שמאלה ברמזור.","use":"turn left = לפנות שמאלה. left גם עבר של leave.","tip":"left hand – היד השמאלית (L)."},"use#1":{"tr":"אני משתמשת בעט כדי לכתוב.","use":"פועל (ה-s נשמעת z): use + שם עצם, use X to do Y.","tip":"use – להשתמש, כמו 'יוזר' (user)."},"number":{"tr":"מה מספר הטלפון שלך?","use":"a number of = כמה. the number of = מספר ה-.","tip":"number – נאמבר, מספר."},"result in":{"tr":"הקטטה הסתיימה באף שבור.","use":"result in + תוצאה. result from + סיבה.","tip":"result – תוצאה; מסתיים בתוצאה."},"post#6":{"tr":"הסוס היה קשור לעמוד עץ.","use":"שם עצם: עמוד שתקוע באדמה. goalpost = עמוד שער.","tip":"post – עמוד, כמו עמוד גדר."},"until":{"tr":"חכה עד שאחזור.","use":"עד (זמן). אחריו הווה על העתיד. בדיבור גם till.","tip":"until – 'אנטיל', עד אז."},"ahead of":{"tr":"היא הגיעה לפני כולם.","use":"לפני, בזמן או במקום: ahead of time = מוקדם.","tip":"ahead – head = ראש, בראש התור."},"based on":{"tr":"הסרט מבוסס על סיפור אמיתי.","use":"be based on = מבוסס על.","tip":"base – בסיס."},"well#2":{"tr":"הייתי חולה, אבל עכשיו אני בריאה.","use":"שם תואר אחרי be או feel: I'm well = אני בריאה.","tip":"get well soon – החלמה מהירה."},"play#0":{"tr":"הילדים משחקים בגינה.","use":"play + משחק/ספורט (play football), play + כלי נגינה (play the piano).","tip":"play – 'פליי', כמו כפתור Play."},"few":{"tr":"יש לי כמה חברים בעיר הזאת.","use":"a few = כמה (חיובי). few = מעט מאוד (שלילי). לשמות עצם ספירים.","tip":"few – 'פיו', מעטים."},"company":{"tr":"הוא עובד בחברה גדולה.","use":"חברה עסקית. גם 'חברה' של אנשים: keep me company.","tip":"company – קומפני, חברה."},"state#1":{"tr":"טקסס היא מדינה גדולה בארה\"ב.","use":"מדינה (במיוחד בתוך ארה\"ב). the United States.","tip":"United States – המדינות המאוחדות."},"i.e.#0":{"tr":"הוא טבעוני, כלומר הוא לא אוכל מוצרים מן החי.","use":"מלטינית id est. בא לפני הסבר מדויק, עם פסיקים. לא לבלבל עם e.g. (לדוגמה).","tip":"i.e. = in essence – כלומר."},"different":{"tr":"יש לנו רעיונות שונים.","use":"different from = שונה מ-.","tip":"different – דיפרנט, שונה."},"however#0":{"tr":"לא משנה כמה אני מנסה, אני לא מצליחה לפתוח את הדלת.","use":"however + תואר = לא משנה כמה.","tip":"how + ever – איך שלא יהיה."},"around#1":{"tr":"זה עולה בערך עשרה דולר.","use":"לפני מספר: בערך. כמו about.","tip":"around 10 – מסביב לעשר."},"done#0":{"tr":"שיעורי הבית שלי גמורים.","use":"be done = גמור, הסתיים. I'm done = סיימתי.","tip":"done – 'דאן', זה נעשה וזהו."},"group":{"tr":"קבוצה של תלמידים חיכתה בחוץ.","use":"a group of + רבים. גם פועל: לקבץ.","tip":"group – גרופ, קבוצה."},"even#2":{"tr":"הוא יישר את הקרקע לפני הבנייה.","use":"פועל: even out = ליישר, להשוות.","tip":"even – שווה; עושים שיהיה שווה."},"public":{"tr":"זה פארק ציבורי.","use":"שם תואר: ציבורי. the public = הציבור. ההפך: private.","tip":"public – פאבליק, לכולם."},"government":{"tr":"הממשלה העלתה את המסים.","use":"שם עצם: הממשלה, השלטון.","tip":"govern = לשלוט; government = מי ששולטים."},"every day":{"tr":"אני מוציאה את הכלב לטיול כל יום.","use":"every day (שתי מילים) = כל יום. everyday (מילה אחת) = יומיומי.","tip":"every = כל, day = יום."},"care#0":{"tr":"אני לא כל כך אוהבת אוכל חריף.","use":"care for = לחבב (בעיקר בשלילה ובשאלה): Would you care for tea?","tip":"care – אכפת לי ממנו, כלומר אני מחבבת."},"start":{"tr":"השיעור יתחיל בתשע.","use":"start + -ing או start to. ההפך: finish/stop.","tip":"start – סטארט, התחלה."},"since#1":{"tr":"מכיוון שהיה מאוחר, לקחנו מונית.","use":"במשמעות 'מכיוון ש-' בא לרוב בתחילת המשפט.","tip":"since – מאז שזה כך, אז..."},"system#0":{"tr":"לבית הספר יש מערכת מחשבים חדשה.","use":"שם עצם: מערכת.","tip":"system – סיסטם, מערכת."},"together with":{"tr":"שלחי את המכתב יחד עם התמונות.","use":"יחד עם, בנוסף ל-.","tip":"together – 'טוגדר', ביחד."},"different from":{"tr":"הסגנון שלי שונה משלך.","use":"different from (נפוץ ונכון), באמריקה גם different than.","tip":"different – שונה, from – מ-."},"asked for":{"tr":"הוא ביקש כוס מים.","use":"ask for + דבר = לבקש. ask + שאלה = לשאול.","tip":"ask – לשאול; ask for – 'לשאול בשביל' משהו, לבקש."},"by no means#0":{"tr":"הוא בשום אופן לא השחקן הכי טוב, אבל הוא טוב.","use":"ביטוי שלילה חזק: בשום אופן לא. בא בתוך המשפט.","tip":"no means – אין שום דרך."},"case#0":{"tr":"במקרה הזה, את צריכה רופא.","use":"in this case = במקרה הזה. in case of = במקרה של.","tip":"case – 'קייס', כמו תיק משפטי – מקרה."},"person":{"tr":"היא אדם טוב מאוד.","use":"יחיד. הרבים: people (ובשפה רשמית persons).","tip":"person – פרסונה, אדם."},"still#2":{"tr":"האגם היה שקט ודומם.","use":"שם תואר: לא זז. stand still = לעמוד בלי לזוז.","tip":"still life = טבע דומם בציור."},"for example":{"tr":"יש בעלי חיים, למשל חתולים, שישנים הרבה.","use":"מביא דוגמה. מקוצר: e.g.","tip":"example – דוגמה (אקזמפל)."},"house#1":{"tr":"הם גרים בבית גדול.","use":"שם עצם (ה-s נשמעת s). at my house = אצלי בבית.","tip":"house – 'האוס', בית."},"in particular":{"tr":"אני אוהבת פירות, במיוחד תפוחים.","use":"מדגיש דבר מסוים מתוך קבוצה. דומה ל-especially.","tip":"particular – פרטני, מסוים."},"in addition":{"tr":"הוא מדבר אנגלית. בנוסף, הוא מדבר ערבית.","use":"בתחילת משפט עם פסיק. in addition to + שם עצם.","tip":"addition – חיבור (בחשבון), מוסיפים עוד."},"prior to":{"tr":"בבקשה התקשרו לפני הביקור שלכם.","use":"רשמי: לפני. אחריו שם עצם או -ing.","tip":"prior – 'פריור', קודם (כמו priority – עדיפות)."},"yet#0":{"tr":"האוטובוס עוד לא הגיע.","use":"בסוף משפט שלילה או שאלה: not yet, Have you eaten yet?","tip":"not yet – 'עוד לא'."},"change#0":{"tr":"הנה העודף שלך, אדוני.","use":"שם עצם לא ספיר: עודף, מטבעות קטנים.","tip":"change – מה ש'משתנה' בחזרה מהשטר."},"full":{"tr":"הכוס מלאה במים.","use":"full of = מלא ב-. ההפך: empty.","tip":"full – 'פול', מלא עד הסוף."},"enough":{"tr":"יש לנו מספיק אוכל לכולם.","use":"לפני שם עצם (enough food) ואחרי תואר (big enough).","tip":"enough – 'אינאף', די!"},"once#0":{"tr":"פעם גרתי בפריז.","use":"פעם אחת (once a week) או פעם, בעבר (I once lived).","tip":"once upon a time – היה היה פעם."},"support":{"tr":"תודה על התמיכה שלך.","use":"גם שם עצם וגם פועל: support someone = לתמוך במישהו.","tip":"support – סאפורט, תמיכה."},"set up":{"tr":"הקמנו את האוהל ליד הנהר.","use":"פועל עם מילת יחס: להקים, לארגן. גם שם עצם: setup.","tip":"set up – להעמיד למעלה, להקים."},"make sure":{"tr":"ודאי שהדלת נעולה.","use":"make sure (that) + משפט, או make sure of.","tip":"sure = בטוח; לעשות שיהיה בטוח."},"along with":{"tr":"היא באה יחד עם החברים שלה.","use":"יחד עם, בנוסף ל-.","tip":"along – לאורך הדרך, ביחד."},"found#1":{"tr":"הם ייסדו את בית הספר ב-1950.","use":"פועל רגיל: found – founded. founder = מייסד.","tip":"foundation – יסוד; found = להניח יסוד."},"including":{"tr":"באו עשרה אנשים, כולל המורה.","use":"לפני שם עצם: including me.","tip":"include – לכלול."},"show#1":{"tr":"את יכולה להראות לי את הדרך?","use":"show someone something / show something to someone. עבר: showed, shown.","tip":"show – להציג, כמו בשואו."},"until now":{"tr":"עד עכשיו לא ראיתי שלג אף פעם.","use":"בא לרוב עם Present Perfect: have never seen.","tip":"until = עד, now = עכשיו."},"call":{"tr":"אתקשר אלייך הערב.","use":"call someone = להתקשר אליו. call someone X = לקרוא לו X.","tip":"call – 'קול', קול בטלפון."},"though":{"tr":"האוכל היה זול. אבל הוא היה טוב.","use":"בסוף משפט = אבל, בכל זאת. בתחילת משפט = למרות ש-.","tip":"though – 'דוֹ', כמו although מקוצר."},"side#0":{"tr":"הוא עמד בצד השני של הכביש.","use":"on the other side = בצד השני. side by side = זה לצד זה.","tip":"side – 'סייד', צד."},"take place":{"tr":"החתונה תתקיים ביוני.","use":"להתרחש, בעיקר לאירועים מתוכננים. לא בסביל.","tip":"take place – לתפוס מקום בזמן."},"later":{"tr":"אתקשר אלייך מאוחר יותר.","use":"See you later = נתראה אחר כך.","tip":"later – late = מאוחר."},"keep#1":{"tr":"המלך התחבא במגדל המבצר של הטירה.","use":"שם /* a new random order for every quiz; the same English word never comes close to itself;
   a list spanning several levels stays in level order (shuffled inside each level) */
/* repeated English words are placed at least 300 cards apart; when the quiz is too short for that,
   as far apart as it allows. The other cards fill the gaps in random order. */
const MINGAP=300;

  shuffle(ws).forEach(w=>{const k=w.e.toLowerCase();(grp[k]=grp[k]||[]).push(w)});
  const reps=Object.values(grp).filter(g=>g.length>1).sort((x,y)=>y.length-x.length),singles=Object.values(grp).filter(g=>g.length===1).map(g=>g[0]);
  for(const g of reps){const k=g.length;let gap=Math.min(MINGAP,Math.floor((n-1)/(k-1))),done=false;
    /* first a random start where every copy lands on a free place at this distance; if there is none, a slightly smaller distance */
    while(!done&&gap>0){const offs=shuffle([...Array(n-(k-1)*gap).keys()]);
      for(const o of offs)if(g.every((_,i)=>!slot[o+i*gap])){g.forEach((w,i)=>slot[o+i*gap]=w);done=true;break}
      if(!done)gap--}
    if(!done)g.forEach(w=>{const f=slot.indexOf(null);slot[f]=w})}
  let j=0;for(let i=0;i<n;i++)if(!slot[i])slot[i]=singles[j++];return slot}

/* quiz-logic */
let Q=null;
const blankQ=()=>({stage:'write',mine:[],opts:null,sel:[],checked:false,shown:false,sent:false});
/* outside voice mode words are read only when a speaker button is pressed, except in the listening quiz, where the word is hidden */
/* "מצב רץ" auto-play mode (button in the quiz / cards top bar, remembered on this device): read each new word aloud */
let AUTO=LS.get('dictAuto')==='1';
const AUTOBTN=()=>`<button class="autob${AUTO?' on':''}" id="autoBtn" aria-pressed="${AUTO}" aria-label="מצב רץ: השמעה אוטומטית של כל מילה">${SPK}<span>${AUTO?'מצב רץ פועל':'מצב רץ'}</span></button>`;
function bindAuto(cur){const b=$('autoBtn');if(b)b.onclick=()=>{AUTO=!AUTO;LS.set('dictAuto',AUTO?'1':'0');draw();if(AUTO&&cur)speak(cur)}}
function autoSay(){if(Q&&(Q.mode==='listen'||AUTO)&&!V.on&&Q.list[Q.i])speak(Q.list[Q.i].e)}
function startQuiz(list,name,from,key){if(!list.length)return;Q={key,list,i:0,score:0,pts:0,max:0,mist:[],marks:{},st:{},base:0,name,from,l:S.l,g:S.g,mode:S.mode,...blankQ()};saveQ();S.active=key;go({screen:'quiz'});autoSay()}
function saveQ(){if(!Q)return;SESS[Q.key]={v:2,kind:'quiz',t:Date.now(),ids:ids(Q.list),i:Q.i,score:Q.score,pts:Q.pts,max:Q.max,mist:ids(Q.mist),marks:Q.marks||{},st:Q.st||{},base:Q.base||0,name:Q.name,from:Q.from,l:Q.l,g:Q.g,mode:Q.mode,stage:Q.stage,mine:Q.mine,opts:Q.opts,sel:Q.sel,checked:Q.checked,shown:Q.shown,sent:Q.sent};saveSess()}
function loadQ(key){const s=SESS[key];if(!s||s.kind!=='quiz'||s.v!==2)return false;
  Q={key,list:objs(s.ids),i:s.i,score:s.score||0,pts:s.pts||0,max:s.max||0,mist:objs(s.mist||[]),marks:s.marks||{},st:s.st||{},base:s.base||0,name:s.name,from:s.from,l:s.l,g:s.g,mode:s.mode,...blankQ(),
    stage:s.stage||'write',mine:Array.isArray(s.mine)?s.mine:[],opts:s.opts||null,sel:s.sel||[],checked:!!s.checked,shown:!!s.shown,sent:!!s.sent};
  if(Q.stage==='pick'&&!Q.opts){Q.stage='write';Q.checked=false}
  /* sessions saved before words kept their own state: words already passed count as marked with their saved mark */
  if(!s.st)Q.list.slice(0,Q.i).forEach(w=>{if(!Q.marks[w.id]&&kst(w))Q.marks[w.id]=kst(w)});
  /* a saved question whose meanings changed since (e.g. a meaning was split): ask it again with fresh options */
  const w=Q.list[Q.i];if(w&&Q.opts){const right=Q.opts.filter(o=>o[1]).map(o=>o[0]),M=meanings(w);
    if(right.length!==M.length||right.some(r=>!M.includes(r))){Object.assign(Q,blankQ(),{mine:Q.mine})}}
  return Q.i<Q.list.length}
function resumeQuiz(key){if(!loadQ(key)){(SDEL[key]=Date.now(),delete SESS[key]);saveSess();draw();return}S.l=Q.l;S.g=Q.g;S.active=key;go({screen:'quiz'});if(!Q.checked)autoSay()}
/* the correct meanings plus ONE wrong meaning that looks or sounds close, to make it confusing */
const bigr=t=>{t=String(t).toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-zא-ת]/g,'');const b=new Set();for(let i=0;i<t.length-1;i++)b.add(t.slice(i,i+2));return b};
const jac=(a,b)=>{if(!a.size||!b.size)return 0;let n=0;a.forEach(x=>{if(b.has(x))n++});return n/(a.size+b.size-n)};
/* meanings that say the same thing: their parts appear together on one dictionary line (e.g. "מצב, מעמד") */
const mparts=m=>String(m).replace(/[\u0591-\u05C7]/g,'').replace(/\([^)]*\)/g,'').split(/[,;\/]/).map(x=>x.replace(/[-־'"״׳.]/g,'').replace(/\s+/g,' ').trim()).filter(x=>x.length>1);
const SYN=(()=>{const g=new Map();for(const r of RAW)for(const m of r.h){const ps=mparts(m);for(const p of ps){if(!g.has(p))g.set(p,new Set());ps.forEach(q=>g.get(p).add(q))}}return g})();
function synOf(right){const syn=new Set();right.forEach(r=>mparts(r).forEach(p=>{syn.add(p);(SYN.get(p)||[]).forEach(q=>syn.add(q))}));const arr=[...syn];return{syn,arr,sb:arr.map(bigr)}}
/* at most one letter apart (הודות / תודות) */
function near1(a,b){if(a===b)return true;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;let i=0,j=0,d=0;
  while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;continue}if(++d>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++}}return d+(la-i)+(lb-j)<=1}
function sameMeaning(m,S){return mparts(m).some(p=>S.syn.has(p)||S.arr.some(q=>near1(p,q))||S.arr.some(q=>q.length>2&&p.length>2&&(p.includes(q)||q.includes(p)))||S.sb.some(b=>jac(b,bigr(p))>=.7))}
function buildOpts(w){const right=meanings(w),rb=right.map(bigr),eb=bigr(w.e),parts=right.join(',').split(/[,;\/]/).map(x=>x.trim()).filter(Boolean);
  const cands=[],SY=synOf(right);
  for(const x of words){if(x===w||x.e.toLowerCase()===w.e.toLowerCase())continue;const xm=meanings(x);
    if(xm.some(m=>right.includes(m)))continue;
    const es=jac(eb,bigr(x.e));
    for(const m of xm){if(parts.some(p=>m.includes(p))||(w.others||[]).includes(m)||sameMeaning(m,SY))continue;
      const hs=Math.max(...rb.map(b=>jac(b,bigr(m))));if(hs>.75)continue;cands.push([m,hs+es*.25+(Math.abs(x.l-w.l)<=1?.05:0)])}}
  cands.sort((a,b)=>b[1]-a[1]);
  const top=cands.slice(0,6);const wrong=(top[Math.floor(Math.random()*top.length)]||['—'])[0];
  return shuffle([...right.map(t=>[t,1]),[wrong,0]])}
/* ---------- quiz actions (shared by touch and voice) ---------- */
function qShow(){const w=Q.list[Q.i];Q.opts=buildOpts(w);Q.sel=[];Q.stage='pick';saveQ();draw()}
function qCheck(){const nm=meanings(Q.list[Q.i]).length;Q.checked=true;const got=Q.sel.filter(k=>Q.opts[k][1]).length,bad=Q.sel.filter(k=>!Q.opts[k][1]).length;
  Q.pts+=got;Q.max+=nm;saveQ();draw();const f=app.querySelector('.fb');f&&f.scrollIntoView({block:'nearest',behavior:'smooth'});return{got,bad,nm}}
/* each word keeps its own state (typed text, options, answer) while moving between words with the arrows */
const curState=()=>({stage:Q.stage,mine:Q.mine,opts:Q.opts,sel:Q.sel,checked:Q.checked,shown:Q.shown,sent:Q.sent,old:Q.old});
function enterWord(j){Q.i=j;const s=(Q.st||{})[j],w=Q.list[j];Object.assign(Q,blankQ(),{old:false},s||{});
  /* marked in an older version of the quiz, before answers were kept: show it answered */

    ${Q.mist.length?`<button class="btn" id="retry">בוחן על ${Q.mist.length} המילים שלא ידעת</button>`:''}
    <button class="btn secondary" id="back">סיום</button>
    ${Q.mist.length?`<div><p class="lbl">מילים שסימנת "לא ידעתי"</p><ul class="mist">${Q.mist.map(w=>`<li><button class="spk sm" data-say="${esc(w.e)}" aria-label="השמעה">${SPK}</button><div class="txt"><span class="e">${esc(w.e)}</span><span class="h">${esc(label(w))}</span></div></li>`).join('')}</ul></div>`:''}
  </div>`;
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const r=$('retry');if(r)r.onclick=()=>{S.mode=Q.mode;startQuiz(shuffle(Q.mist),'חזרה · '+Q.name.replace('חזרה · ',''),Q.from,'R'+Q.key.replace(/^R/,''))};
  $('back').onclick=()=>{S.l=Q.l;S.g=Q.g;go({screen:Q.from})};
}

/* flashcards */
let C=null;
function saveC(){if(!C)return;if(C.i>=C.deck.length){(SDEL[C.key]=Date.now(),delete SESS[C.key])}else{SESS[C.key]={kind:'cards',t:Date.now(),ids:ids(C.deck),i:C.i,l:S.l,g:S.g}}saveSess()}
function cardScreen(){
  const n=C.deck.length;
  if(C.i>=n){saveC();S.active=null;persist();app.innerHTML=`<div class="screen"><div class="center"><div class="big">✓</div><h2 style="margin-top:14px">סיימת את כל ${n} הכרטיסיות</h2></div><button class="btn" id="q">עכשיו לבוחן</button><button class="btn secondary" id="b">חזרה לקבוצה</button></div>`;
    $('q').onclick=()=>{go({screen:'group'});const b=app.querySelector('[data-start],[data-resume]');b&&b.click()};
    $('b').onclick=()=>go({screen:'group'});return}
  const w=C.deck[C.i];
  app.innerHTML=`<div class="screen full">
    <div class="qtop"><button class="x" id="exit" aria-label="יציאה">✕</button>${HOME}<div class="prog"><i style="width:${C.i/n*100}%"></i></div><span class="count">${C.i+1} / ${n}</span>${AUTOBTN()}</div>
    <button class="card" id="card" aria-label="הפיכת הכרטיס"><span class="w">${esc(w.e)}</span>${C.open?`<span class="a">${w.h.map(esc).join('<br>')}</span>${w.others.length?`<span class="oth">פירושים נוספים: ${esc(numText(w.others))}</span>`:''}<span class="ex" dir="ltr">${highlight(w.s,w.e)}</span>`:`<span class="hint">הקישי כדי לראות פירוש ומשפט</span>`}</button>
    ${C.open?`<div class="cardx">${trPart(w,true)}${xtras(w,true)}</div>`:''}
    <div class="sticky"><div class="row2"><button class="btn secondary" id="say">${SPK} מילה</button><button class="btn secondary" id="saySent">${SPK} משפט</button></div>
    <div class="row2"><button class="btn secondary" id="prev" ${C.i?'':'disabled'}>הקודם</button><button class="btn" id="nxt">הבא</button></div></div>
  </div>`;
  $('exit').onclick=()=>{saveC();S.active=null;go({screen:'group'})};
  $('card').onclick=()=>{C.open=!C.open;draw()};
  $('say').onclick=()=>speak(w.e);
  $('saySent').onclick=()=>speak(w.s,.9);
  const cardSay=()=>{if(AUTO&&C.deck[C.i])speak(C.deck[C.i].e)};bindAuto(w.e);
  $('prev').onclick=()=>{C.i--;C.open=false;saveC();draw();cardSay()};
  $('nxt').onclick=()=>{C.i++;C.open=false;saveC();draw();cardSay()};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.screen==='quiz'||S.screen==='cards'))$('exit')?.click()});
(function boot(){
  if(S.screen==='quiz'){if(!(S.active&&loadQ(S.active)))S.screen=S.active&&S.active.startsWith('L')?'level':'home'}
  if(S.screen==='cards'){const ss=S.active&&SESS[S.active];if(ss&&ss.kind==='cards'){C={key:S.active,deck:objs(ss.ids),i:ss.i,open:false}}else S.screen='group'}
  draw();
  syncNow(false);
})();
</script>
