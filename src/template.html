<title>מילון אנגלית לפי רמות</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Layout: one screen at a time, like an app — levels → groups → group → quiz. One accent, lots of space. */
:root{
  --bg:#f7f6f3; --surface:#e9e7e2; --ink:#16181d; --muted:#454b55; --line:#c9c5bd;
  --accent:#24548a; --accent-ink:#ffffff; --accent-soft:#dde7f3;
  --ok:#2d6b47; --ok-soft:#dcebe1; --bad:#9a3434; --bad-soft:#f4dede;
  --he:"Assistant",Arial,sans-serif; --en:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141619; --surface:#23272d; --ink:#f3f1ed; --muted:#c4c9d0; --line:#3d434b;
  --accent:#9db6d4; --accent-ink:#15202d; --accent-soft:#232c37;
  --ok:#8fc2a3; --ok-soft:#1d2b23; --bad:#d9a0a0; --bad-soft:#33221f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --surface:#23272d; --ink:#f3f1ed; --muted:#c4c9d0; --line:#3d434b;
  --accent:#9db6d4; --accent-ink:#15202d; --accent-soft:#232c37;
  --ok:#8fc2a3; --ok-soft:#1d2b23; --bad:#d9a0a0; --bad-soft:#33221f; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--he);font-size:18px;line-height:1.55}
.app{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;min-height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:700}
.sub{color:var(--muted);margin:.35rem 0 0}
.screen{display:flex;flex-direction:column;gap:20px}

/* top nav */
.nav{display:flex;align-items:center;gap:8px;min-height:48px}
.nav .home-btn{margin-inline-start:auto}
.home-btn{border:0;background:var(--surface);color:var(--muted);width:40px;height:40px;border-radius:50%;cursor:pointer;flex:none;display:inline-grid;place-items:center;padding:0}.home-btn svg{width:20px;height:20px}
.search{margin:0;padding-inline-end:44px}.sbox{position:relative;margin:4px 0}.sclear{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font-size:1rem;cursor:pointer;padding:0}.sclear[hidden]{display:none}
.sticky .row2.quick{margin-top:8px}
.today{display:flex;flex-direction:column;gap:6px;width:100%;text-align:right;border:0;border-radius:16px;background:var(--accent-soft);padding:14px 16px;cursor:pointer;color:var(--ink);font:inherit}
.today .td-top{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted)}.today .td-hist{color:var(--accent);font-weight:700}
.today .td-num{font-size:1.05rem}.today .td-num b{font-size:1.5rem}.today.done{background:var(--ok-soft)}.today.done .bar2 i,.days li.done .bar2 i{background:var(--ok)}
.days{list-style:none;margin:0;padding:0}.days li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}.days .bar2{grid-column:1/-1;display:block;background:var(--surface)}.today .bar2{display:block}.days .dn{font-weight:700}.days li.done .dn{color:var(--ok)}
.totop{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;z-index:20;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--bg);font-size:1.4rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}.totop[hidden]{display:none}
.reload{position:fixed;top:50%;inset-inline-end:4px;z-index:20;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--accent);font-size:1.25rem;line-height:1;opacity:.7;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;padding:0}.reload.spin{animation:rspin .8s linear infinite;opacity:1}@keyframes rspin{to{transform:rotate(360deg)}}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
/* calm look: lighter weights, hairline borders, softer shadows */
.btn{font-weight:600;border-radius:12px;box-shadow:none}
.item,.panel,.today{border:1.5px solid var(--line);box-shadow:none}
.item{background:var(--bg)}.panel{background:var(--bg)}
.totop{background:var(--ink);opacity:.75}
/* word extras: tip / usage / my note / sentence translation */
.xtras{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.xbtn{border:1.5px solid var(--accent);background:var(--bg);color:var(--accent);border-radius:999px;padding:7px 16px;font-size:.95rem;font-weight:700;cursor:pointer}
.xbtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.xbox{background:var(--bg);border:1.5px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:12px;padding:12px 16px;font-size:1.02rem;line-height:1.65;color:var(--ink);text-align:right;margin-top:8px}
.xbox h4{margin:0 0 6px;font-size:.95rem;font-weight:800;color:var(--accent)}
.xbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.xbox li{position:relative;padding-inline-start:16px}
.xbox li::before{content:"";position:absolute;inset-inline-start:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.xbox li bdi{font-family:var(--en);font-weight:600}
.xbox ol.num{margin:0;padding:0;list-style:none;counter-reset:n;display:flex;flex-direction:column;gap:8px}.xbox ol.num li{counter-increment:n;padding-inline-start:30px}.xbox ol.num li::before{content:counter(n);top:.15em;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--he)}
.trans{display:block;margin-top:6px;color:var(--ink);font-family:var(--he);font-size:1rem;direction:rtl;text-align:center;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.scol{flex:1;min-width:0}.xfull{display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}.cardx{display:flex;flex-direction:column;gap:8px}.words .xtras{justify-content:flex-start;margin-top:6px}
.trbtn{border:0;background:none;color:var(--accent);font-size:.95rem;font-weight:700;padding:4px 0 0;cursor:pointer;display:block;margin:2px auto 0;text-align:center}
#srchRes .words{margin-bottom:8px}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:10px 4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.back::before{content:"→";font-size:1.2em}

/* primary actions */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1rem;cursor:pointer;padding:12px 18px}
.btn.secondary{background:var(--surface);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* simple list rows */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;background:var(--surface);border:0;border-radius:14px;padding:16px 18px;min-height:64px;cursor:pointer}
.item .t{font-weight:700;font-size:1.1rem}
.item .d{color:var(--muted);font-size:.95rem}
.item .chev{color:var(--muted);font-size:1.3rem}
.item.done .d{color:var(--ok);font-weight:600}
.lbl{font-size:.95rem;color:var(--muted);font-weight:600;margin:0}

/* segmented control */
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:44px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* word list in a group */
.words{list-style:none;margin:0;padding:0}
.words li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.words .txt{flex:1;min-width:0}
.words .e{font-family:var(--en);font-weight:600;font-size:1.1rem;direction:ltr;text-align:right}
.words .h{color:var(--muted);font-size:.98rem}
.words li.ok .e::after{content:" ✓";color:var(--ok);font-family:var(--he)}
.spk{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.spk svg{width:20px;height:20px}
.no-tts .spk{display:none}
details.wl summary{cursor:pointer;color:var(--accent);font-weight:700;min-height:44px;display:flex;align-items:center}

/* quiz */
.qtop{display:flex;align-items:center;gap:14px}
.x{border:0;background:var(--surface);width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.1rem;flex:none}
.prog{flex:1;height:8px;background:var(--surface);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;flex:none}
.word{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 12px 28px;text-align:center}
.word .w{font-family:var(--en);font-weight:600;font-size:clamp(2rem,9vw,2.8rem);direction:ltr;line-height:1.15}
.word .spk{width:52px;height:52px}
.ask{font-weight:700;margin:0}
.inp{width:100%;min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-size:1.15rem;padding:12px 16px}
.inp:focus{border-color:var(--accent);outline:none}
.mine{background:var(--surface);border-radius:12px;padding:12px 16px;margin:0}
.mine span{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:right;min-height:58px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 16px;font-size:1.08rem;cursor:pointer}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt:focus:not(:focus-visible){outline:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{margin:0;font-weight:700;font-size:1.1rem;text-align:center}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb:empty{display:none}

/* results */
.big{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.center{text-align:center}
.mist{list-style:none;margin:0;padding:0}
.mist li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mist .e{font-family:var(--en);font-weight:600;direction:ltr}
.mist .h{color:var(--muted);text-align:left}

/* flashcard */
.card{background:var(--surface);border:0;border-radius:18px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;cursor:pointer;width:100%}
.card .w{font-family:var(--en);font-weight:600;font-size:2.2rem;direction:ltr}
.card .a{font-size:1.25rem}
.card .hint{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.howto{color:var(--muted);font-size:.95rem}
.howto summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:44px;display:flex;align-items:center}
.howto ol{margin:0;padding-inline-start:20px}

/* mobile tuning */
html,body{height:100%}
button,.item,.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:active,.item:active,.opt:active:not(:disabled){transform:scale(.985)}
.sticky{position:sticky;bottom:0;z-index:3;display:flex;flex-direction:column;gap:10px;background:var(--bg);padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:auto}
.screen.full{min-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.qtop{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3;padding-block:8px}
.inp{font-size:max(16px,1.15rem)}
.mist li{flex-wrap:wrap}
.mist .h{text-align:right;flex-basis:100%}
@media (max-width:420px){
  body{font-size:17px}
  .app{padding-inline:16px;padding-block:12px 24px}
  h1{font-size:1.6rem} h2{font-size:1.35rem}
  .item{padding:14px 16px}
  .card{min-height:220px}
  .card .w{font-size:1.9rem}
}
@media (max-height:720px){
  .word{padding:14px 8px 10px;gap:10px}
  .word .spk{width:46px;height:46px}
  .screen{gap:14px}
}

.item{justify-content:flex-start}
.item .grow{flex:1;min-width:0}
.item .num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px}
.panel h3{margin:0;font-size:1.1rem;font-weight:700}
.panel .seg{background:var(--bg)}

.set-box{display:flex;flex-direction:column;gap:14px}
.set-box .lbl{margin-bottom:8px}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.link{border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:10px 4px;cursor:pointer;min-height:44px;align-self:center}
.sentence{display:flex;align-items:flex-start;gap:10px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-family:var(--en);font-size:1.08rem;line-height:1.45}
.sentence{position:relative}.sentence>.spk{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%)}.sentence .scol{text-align:center;padding:0 40px}.sentence span{display:block;text-align:center}.sentence .trans{text-align:center}
mark{background:none;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.spk.sm{width:38px;height:38px;flex:none}
.spk.sm svg{width:17px;height:17px}
.mode-tag{margin:0;text-align:center;color:var(--muted);font-size:.9rem;font-weight:600}
.word.listen{padding:28px 12px 12px}
.play{width:120px;height:120px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-weight:700;font-size:.85rem}
.play svg{width:40px;height:40px}
.ex{font-family:var(--en);direction:ltr;text-align:left;color:var(--muted);font-size:.95rem;margin-top:4px}
.card .ex{text-align:center;font-size:1.05rem;color:var(--ink)}
.mist li{align-items:center;flex-wrap:nowrap}
.mist .txt{display:flex;flex-direction:column;flex:1;min-width:0}
.mist .h{text-align:right;flex-basis:auto}
.btn svg{width:20px;height:20px}

.resume-card{width:100%;display:flex;align-items:center;gap:12px;text-align:right;border:0;border-radius:16px;padding:18px;min-height:72px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.resume-card .t{font-weight:800;font-size:1.15rem}
.resume-card .d{opacity:.9;font-size:.95rem}
.resume-card .grow{flex:1;min-width:0}
.resume-info{margin:0;color:var(--ink)}
.bar2{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--accent)}

.words li.bad .e{color:var(--bad)}
.words li.bad .e::after{content:" · טעות";font-family:var(--he);font-size:.8rem;font-weight:700}
.rm{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--bad-soft);color:var(--bad);cursor:pointer;font-size:.95rem}
.mist-panel{background:var(--bad-soft)}
.cartog{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:2px solid var(--line,#ddd);border-radius:14px;background:none;color:inherit;padding:10px 12px;margin-bottom:12px;cursor:pointer;font:inherit}
.cartog .ci{font-size:1.6rem}.cartog .ct{flex:1;display:flex;flex-direction:column;gap:2px}.cartog .ct span{font-size:.85rem;opacity:.75}
.cartog .sw{width:44px;height:26px;border-radius:13px;background:#ccc;position:relative;flex:none}.cartog .sw i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:right .15s}
.cartog.on{border-color:var(--accent)}.cartog.on .sw{background:var(--accent)}.cartog.on .sw i{right:21px}
.cartag{text-align:center;font-weight:700;opacity:.7;margin:4px 0}.carmean{text-align:center;margin:14px 0;padding:10px;border-radius:12px}.carmean .lbl{margin:0 0 4px;font-size:.85rem;opacity:.7}.carmean .cm{font-size:1.5rem;font-weight:800;margin:0}.carmean .oth{font-size:.9rem;opacity:.75;margin:6px 0 0}
.carrow{display:flex;gap:8px}.carrow .btn{flex:1;padding-left:6px;padding-right:6px}.carnav{display:flex;justify-content:space-between}.carmean.think .cm{opacity:.6}.carrow .btn,.carnav .btn{flex-direction:column;gap:0}.carrow .btn small,.carnav .btn small{display:block;font-size:.72rem;font-weight:500;opacity:.8;margin-top:2px}
.carnav{display:grid!important;grid-template-columns:1fr 1.5fr 1fr 1fr;gap:6px}.carnav .btn:disabled{opacity:.35}.carnav .btn{padding:8px 2px;font-size:1.1rem;line-height:1.1;min-height:54px}
.cartap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:0;background:rgba(20,24,40,.82);color:#fff;font:inherit;font-size:24px;padding:24px;text-align:center}.cartap .big{font-size:72px;line-height:1}.cartap small{font-size:15px;opacity:.85;max-width:300px}
.carsethd{display:flex;align-items:center;justify-content:space-between;gap:8px}.carsethd b{font-size:17px}.carsethd .x{width:38px;height:38px}

.kflash.on{opacity:1}.kflash>div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 44px;border-radius:28px;border:4px solid;box-shadow:0 12px 40px rgba(0,0,0,.25);transform:scale(.9);transition:transform .25s}
.kflash.on>div{transform:scale(1)}.kflash .big{font-size:84px;line-height:1;font-weight:800}.kflash b{font-size:40px}.kflash small{font-size:22px;opacity:.8}
.kflash.ky>div{background:#e3f4e8;border-color:#2e8b57;color:#1f6b40}.kflash.kn>div{background:#fbe4e4;border-color:#c0392b;color:#9b2c22}
/* מצב רכב: compact, so the meaning and the memory tip fit without scrolling */
.car .qtop{margin-bottom:0}.car .cartag{margin:0;font-size:.85rem}
.car .word{flex-direction:row;justify-content:center;padding:6px 8px 4px;gap:12px}.car .word .w{font-size:clamp(1.8rem,8vw,2.4rem)}.car .word .spk{width:42px;height:42px}
.car .sentence{margin-top:4px;padding:7px 12px;font-size:1rem;line-height:1.35}
.car .carmean{margin:6px 0 4px;padding:4px 8px}.car .carmean .lbl{font-size:.78rem;margin:0}.car .carmean .cm{font-size:1.35rem}.car .carmean .oth{margin-top:2px;font-size:.85rem}
.screen.car{gap:6px}.car .xfull{margin:0;gap:6px}.car .xbox{padding:8px 12px;margin:0}.car .xbox h4{margin:0 0 4px}
.car .carbar{padding-top:6px;padding-bottom:6px;gap:6px}.car .carrow .btn{padding-top:7px;padding-bottom:7px;min-height:0}.car .carnav .btn{min-height:44px;padding:5px 2px}

/* a new random order for every quiz; the same English word never comes close to itself;
   a list spanning several levels stays in level order (shuffled inside each level) */
/* repeated English words are placed at least 300 cards apart; when the quiz is too short for that,
   as far apart as it allows. The other cards fill the gaps in random order. */
const MINGAP=300;
function spreadShuffle(ws){const n=ws.length,slot=new Array(n).fill(null),grp={};
  shuffle(ws).forEach(w=>{const k=w.e.toLowerCase();(grp[k]=grp[k]||[]).push(w)});
  const reps=Object.values(grp).filter(g=>g.length>1).sort((x,y)=>y.length-x.length),singles=Object.values(grp).filter(g=>g.length===1).map(g=>g[0]);
  for(const g of reps){const k=g.length;let gap=Math.min(MINGAP,Math.floor((n-1)/(k-1))),done=false;
    /* first a random start where every copy lands on a free place at this distance; if there is none, a slightly smaller distance */
    while(!done&&gap>0){const offs=shuffle([...Array(n-(k-1)*gap).keys()]);
      for(const o of offs)if(g.every((_,i)=>!slot[o+i*gap])){g.forEach((w,i)=>slot[o+i*gap]=w);done=true;break}
      if(!done)gap--}
    if(!done)g.forEach(w=>{const f=slot.indexOf(null);slot[f]=w})}

function catPanel(base,ws){if(!ws.some(w=>kst(w))&&!CATS.some(c=>SESS[c[0]+base]))return '';
  if(CARON){const rows=CATS.map(([p,lbl,f])=>{const k=p+base,cs=SESS['C'+k],n=ws.filter(f).length;if(!n)return '';
      return cs&&cs.kind==='car'?`<div class="cat-row"><button class="btn cat-${p}" data-carres="${k}">🚗 המשך · ${lbl} · מילה ${Math.min(cs.i+1,cs.ids.length)} מתוך ${cs.ids.length}</button><div class="cat-links"><button class="link" data-carnew="${k}">התחלה מחדש</button></div></div>`

function catDiff(ss,ws,f){const byId={get:id=>objs([id])[0]},inS=new Set(objs(ss.ids).map(w=>w.id));

let C=null;

let CAR=null;const CARWAIT=4000;
/* reading speed of the Hebrew in מצב רכב (saved): tips are read a little slower than the meaning */
const CRATES=[['איטית',.8],['רגילה',.95],['מהירה',1.1]];let CRATE=+(LS.get('dictCarRate')||.8);
function saveCar(){if(!CAR)return;const k='C'+CAR.key;if(CAR.i>=CAR.deck.length){(SDEL[k]=Date.now(),delete SESS[k])}else SESS[k]={kind:'car',t:Date.now(),ids:ids(CAR.deck),i:CAR.i,name:CAR.name,from:CAR.from,l:S.l,g:S.g};saveSess()}
/* the tip as Hebrew speech: without the English word at its start, emojis, quotes and symbols */
function speakTip(t){return String(t||'').replace(/^[^–]*[A-Za-z][^–]*–\s*/,'').replace(/[\u{1F000}-\u{1FFFF}☀-➿⬀-⯿️‍]/gu,'')
  .replace(/[A-Za-z][A-Za-z'’ \-]*[A-Za-z]|[A-Za-z]/g,' ').replace(/[→⇒➡←⬅]/g,', ').replace(/\s*=\s*/g,', כלומר ').replace(/\+/g,' ו').replace(/['"״׳]/g,'').replace(/\s*\/\s*/g,', ').replace(/\s+/g,' ').replace(/(,\s*)+/g,', ').trim()}

/* the Gemini clips of this word and the next are made while the English plays */
function gemPre(i){if(!GKEY())return;[i,i+1].forEach(k=>{const w=CAR.deck[k];if(!w)return;const x=EXTRA[w.xid||w.id]||{},t=speakTip(x.tip);
  (enGem?gemAudio(w.e,enGem,true).then(()=>w.s&&gemAudio(w.s,enGem,true)):Promise.resolve()).then(()=>heGem&&gemAudio(carMean(w))).then(()=>heGem&&t&&gemAudio('טיפ לזכירה: '+t))})}

  CAR={key,deck:list,i:Math.min(at||0,list.length-1),name,from,play:true,tok:0,step:'',rev:false};saveCar();S.active=key;go({screen:'car'});carPlay(true)}

function carPlay(inTap){if(!CAR)return;CAR.play=true;CAR.wait=false;const tk=++CAR.tok;unlockAudio();keepAlive(true);playbackSession();
  try{if(navigator.wakeLock&&!V.lock)navigator.wakeLock.request('screen').then(l=>V.lock=l).catch(()=>{})}catch(e){}
  prefetchWords(CAR.i,4,CAR.deck);carMedia();
  /* iOS: the device voice must speak once inside a tap before it may speak by itself (only the first time; never right after cancel) */
  /* the word starts only after "מתחילים" has finished: on iPhone the device voice and the recorded word must not start together,
     or the recording is cut after a moment and the reading stalls */
  if(inTap&&TTS&&!CAR.unl){CAR.unl=true;sayNow('מתחילים','he-IL',()=>setTimeout(()=>{if(CAR&&CAR.play&&CAR.tok===tk)carLoop(tk)},300));return}
  carLoop(tk)}
async function carLoop(tk){const alive=()=>CAR&&CAR.play&&CAR.tok===tk&&S.screen==='car';
  while(alive()&&CAR.i<CAR.deck.length){const w=CAR.deck[CAR.i],x=EXTRA[w.xid||w.id]||{};prefetchWords(CAR.i,4,CAR.deck);gemPre(CAR.i);
    const step=async(name,fn)=>{if(!alive())return false;CAR.step=name;carMark();await fn();return alive()};
    if(!await step('w',()=>say(w.e,'en-US')))return;
    if(w.s&&!await step('s',()=>say(w.s,'en-US')))return;
    /* a few seconds to think before the answer */
    if(!CAR.rev){if(!await step('p',async()=>{const t0=Date.now();while(alive()&&Date.now()-t0<CARWAIT)await wait(100)}))return;CAR.rev=true;draw()}
    if(!await step('h',()=>say(carMean(w),'he-IL',Math.min(1,CRATE+.15))))return;
    if(x.tip&&!await step('t',async()=>{const t=speakTip(x.tip);if(t)await sayAll(['טיפ לזכירה:',t],alive,CRATE)}))return;
    /* the next word comes only after ידעתי / לא ידעתי */
    if(!alive())return;CAR.step='m';CAR.wait=true;tone(660);draw();return}

   "לחצי כדי להמשיך" appears, and that tap starts it (the speech must begin inside the tap, so no delay before it) */
function carRestart(inTap){if(!CAR||S.screen!=='car'||CAR.i>=CAR.deck.length)return;CAR.tok++;stopAudio();try{speechSynthesis.cancel()}catch(e){}
  CAR.play=true;CAR.wait=false;CAR.rev=false;CAR.hidOn=false;CAR.needTap=false;const tk=++CAR.tok;if(inTap){unlockAudio();CAR.unl=true}keepAlive(true);playbackSession();carMedia();

    let st=false;try{const u=new SpeechSynthesisUtterance('מתחילים');u.lang='he-IL';if(heVoice)u.voice=heVoice;AUDT=Date.now();

  if(document.visibilityState==='hidden'){if(CAR.play||CAR.wait)CAR.hidOn=true;return}

    <div class="row2"><button class="btn secondary" id="prev" ${C.i?'':'disabled'}>הקודם</button><button class="btn" id="nxt">הבא</button></div></div>
  </div>`;
  $('exit').onclick=()=>{saveC();S.active=null;go({screen:'group'})};
  $('card').onclick=()=>{C.open=!C.open;draw()};
  $('say').onclick=()=>speak(w.e);
  $('saySent').onclick=()=>speak(w.s,.9);
  const cardSay=()=>{if(AUTO&&C.deck[C.i])speak(C.deck[C.i].e)};bindAuto(w.e);
  $('prev').onclick=()=>{C.i--;C.open=false;saveC();draw();cardSay()};
  $('nxt').onclick=()=>{C.i++;C.open=false;saveC();draw();cardSay()};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.screen==='quiz'||S.screen==='cards'))$('exit')?.click()});
/* remember the scroll position of each page, so a reload or a return from another app opens at the same place */
const scrKey=()=>[S.screen,S.l,S.g,S.wl||'',S.filter||''].join('|');
const SCR={restoring:true,t:null};
function saveScroll(){if(SCR.restoring)return;LS.set('dictScroll',JSON.stringify({k:scrKey(),y:Math.round(window.scrollY)}))}
window.addEventListener('scroll',()=>{clearTimeout(SCR.t);SCR.t=setTimeout(saveScroll,150)},{passive:true});
window.addEventListener('pagehide',saveScroll);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveScroll()});
/* sentences page: the text cursor is remembered (which box + where in it) and put back after leaving / reloading */
const CARET_K='dictCaret';
function saveCaret(t){if(!t||!t.dataset||!t.dataset.id)return;try{LS.set(CARET_K,JSON.stringify({id:t.dataset.id,f:t.dataset.f,a:t.selectionStart,b:t.selectionEnd}))}catch(e){}}
function restoreCaret(){if(S.screen!=='sent')return;let c=null;try{c=JSON.parse(LS.get(CARET_K)||'null')}catch(e){}if(!c)return;
  if(!c.live)return;const t=app.querySelector(`.sent-item textarea[data-id="${CSS.escape(c.id)}"][data-f="${c.f}"]`);if(!t||document.activeElement===t)return;
  const n=t.value.length,a=Math.min(c.a??n,n),b=Math.min(c.b??a,n);
  try{t.focus({preventScroll:true});t.setSelectionRange(a,b)}catch(e){}
  const r=t.getBoundingClientRect();if(r.top<90||r.bottom>innerHeight-20)t.scrollIntoView({block:'center'})}
document.addEventListener('selectionchange',()=>{const t=document.activeElement;if(t&&t.matches&&t.matches('.sent-item textarea'))saveCaret(t)});
document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('.sent-item textarea'))saveCaret(e.target)},true);
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('.sent-item textarea'))saveCaret(e.target)});
/* only when she left the site while typing in a box: finishing a box (keyboard closed / tapped elsewhere) forgets it */
document.addEventListener('visibilitychange',()=>{const a=document.activeElement;
  if(document.visibilityState==='hidden'){if(a&&a.matches&&a.matches('.sent-item textarea')){saveCaret(a);try{const c=JSON.parse(LS.get(CARET_K));c.live=true;LS.set(CARET_K,JSON.stringify(c))}catch(e){}}}
  else setTimeout(()=>{restoreCaret();try{const c=JSON.parse(LS.get(CARET_K)||'null');if(c&&c.live){c.live=false;LS.set(CARET_K,JSON.stringify(c))}}catch(e){}},300)});
document.addEventListener('focusout',e=>{if(!(e.target.matches&&e.target.matches('.sent-item textarea')))return;
  setTimeout(()=>{if(document.visibilityState==='visible'&&!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('.sent-item textarea')))LS.set(CARET_K,'null')},400)});
window.addEventListener('pagehide',()=>{const a=document.activeElement;if(a&&a.matches&&a.matches('.sent-item textarea')){saveCaret(a);try{const c=JSON.parse(LS.get(CARET_K));c.live=true;LS.set(CARET_K,JSON.stringify(c))}catch(e){}}});
function restoreScroll(){let v=null;try{v=JSON.parse(LS.get('dictScroll')||'null')}catch(e){}
  const done=()=>{SCR.restoring=false};if(!v||v.k!==scrKey()||!v.y){done();setTimeout(restoreCaret,300);return}
  const to=()=>{app.querySelectorAll('.sent-item textarea').forEach(autoGrow);window.scrollTo(0,v.y)};
  to();requestAnimationFrame(to);setTimeout(to,150);setTimeout(()=>{to();done();restoreCaret()},600);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(SCR.restoring)to()})}
(function boot(){
  if(S.screen==='quiz'){if(!(S.active&&loadQ(S.active)))S.screen=S.active&&S.active.startsWith('L')?'level':'home'}
  if(S.screen==='cards'){const ss=S.active&&SESS[S.active];if(ss&&ss.kind==='cards'){C={key:S.active,deck:objs(ss.ids),i:ss.i,open:false}}else S.screen='group'}
  if(S.screen==='car'){const cs=S.active&&SESS['C'+S.active];if(cs&&cs.kind==='car'){CAR={key:S.active,deck:objs(cs.ids),i:cs.i,name:cs.name,from:cs.from,play:false,tok:0,step:'',needTap:true}}else S.screen=S.active&&S.active.startsWith('L')?'level':'group'}
  draw();restoreScroll();
  syncNow(false);
})();
</script>
