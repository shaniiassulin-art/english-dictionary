<script>
/* ---------- cloud sync (Firestore REST) ---------- */
const FB={key:'AIzaSyDH9rTvdftEKsj7lgM_FkdnQAnNCTQMME4',project:'english-dictionary-452b4'};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function newCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';let r='';const a=new Uint32Array(22);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<22;i++)a[i]=Math.random()*1e9}for(let i=0;i<22;i++)r+=c[a[i]%c.length];return 'd-'+r}
let SYNC_ID=LS.get('dictSyncId');if(!SYNC_ID||SYNC_ID.length<20){SYNC_ID=newCode();LS.set('dictSyncId',SYNC_ID)}
let SYNC={state:'idle',ready:false,applying:false,timer:null};
const docUrl=id=>`https://firestore.googleapis.com/v1/projects/${FB.project}/databases/(default)/documents/dictionary/${encodeURIComponent(id)}?key=${FB.key}`;
function dirty(){if(SYNC.applying)return;LS.set('dictUpdated',String(Date.now()));if(!SYNC.ready)return;clearTimeout(SYNC.timer);setSync('saving');SYNC.timer=setTimeout(push,1200)}
function snapshot(){return JSON.stringify({prog:JSON.parse(LS.get('dictProg')||'{}'),sess:JSON.parse(LS.get('dictSess')||'{}'),know:JSON.parse(LS.get('dictKnow')||'{}')})}
async function push(){
  const t=+(LS.get('dictUpdated')||Date.now());
  try{const r=await fetch(docUrl(SYNC_ID),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{data:{stringValue:snapshot()},updated:{integerValue:String(t)}}})});
    if(!r.ok)throw new Error(r.status);LS.set('dictSynced',String(t));setSync('ok')}catch(e){setSync('error');clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,15000)}
}
async function pull(){
  const r=await fetch(docUrl(SYNC_ID));
  if(r.status===404)return null;if(!r.ok)throw new Error(r.status);
  const j=await r.json();const f=j.fields||{};return{data:JSON.parse(f.data?.stringValue||'{}'),updated:+(f.updated?.integerValue||0)};
}
function mergeData(a,b){
  const prog={...(a.prog||{})};for(const k in (b.prog||{}))prog[k]=Math.max(prog[k]||0,b.prog[k]||0);
  const sess={...(a.sess||{})};for(const k in (b.sess||{}))if(!sess[k]||(b.sess[k].t||0)>(sess[k].t||0))sess[k]=b.sess[k];
  const ka=a.know||migrateMist(a.mist),kb=b.know||migrateMist(b.mist);
  const know={...ka};for(const k in kb)if(!know[k]||(kb[k][1]||0)>(know[k][1]||0))know[k]=kb[k];
  return{prog,sess,know};
}
function applyRemote(d,t){
  SYNC.applying=true;
  try{prog=d.prog||{};SESS=d.sess||{};KNOW=d.know||migrateMist(d.mist);save();saveSess();saveKnow();LS.set('dictUpdated',String(t));LS.set('dictSynced',String(t))}finally{SYNC.applying=false}
  if(!['quiz','cards'].includes(S.screen))draw();
}
async function syncNow(forceRemote){
  setSync('loading');
  try{const rem=await pull(),loc=+(LS.get('dictUpdated')||0);
    SYNC.ready=true;
    if(rem&&(forceRemote||rem.updated>loc))applyRemote(rem.data,rem.updated);
    else if(!rem||loc>rem.updated)await push();
    setSync('ok');
  }catch(e){SYNC.ready=true;setSync('error')}
}
function setSync(st){SYNC.state=st;const el=document.getElementById('syncState');if(el){el.textContent=syncLabel();el.className='sync-state '+st}}
function syncLabel(){return {idle:'',loading:'מתחבר…',saving:'שומר…',ok:'מסונכרן בין המכשירים ✓',error:'אין חיבור כרגע · נשמר במכשיר ויסונכרן אחר כך'}[SYNC.state]||''}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SYNC.ready&&!['quiz','cards'].includes(S.screen))syncNow(false);if(document.visibilityState==='hidden'&&SYNC.timer){clearTimeout(SYNC.timer);push()}});
const D=__DATA__;
const LVN=['קל מאוד','קל','קל-בינוני','בינוני','בינוני+','בינוני-קשה','קשה','קשה מאוד','מתקדם','מומחה'];
const SET=50;
const words=D.map(r=>({id:r[0],e:r[0],h:r[1],l:r[2],s:r[3]}));
const byLv=l=>words.filter(w=>w.l===l);
const group=(l,g)=>byLv(l).slice(g*SET,g*SET+SET);
const nGroups=l=>Math.ceil(byLv(l).length/SET);
let prog={};try{prog=JSON.parse(localStorage.getItem('dictProg')||'{}')}catch(e){}
// migrate old keys "word|unit"
for(const k of Object.keys(prog)){if(k.includes('|')){const e=k.split('|')[0];if(prog[k]>=1)prog[e]=1;delete prog[k]}}
const save=()=>{try{localStorage.setItem('dictProg',JSON.stringify(prog))}catch(e){};dirty()};
save();
const W=Object.fromEntries(words.map(w=>[w.id,w]));
let SESS={};try{SESS=JSON.parse(localStorage.getItem('dictSess')||'{}')}catch(e){}
const saveSess=()=>{try{localStorage.setItem('dictSess',JSON.stringify(SESS))}catch(e){};dirty()};
const ids=a=>a.map(w=>w.id), objs=a=>a.map(i=>W[i]).filter(Boolean);
/* "do I know this word": KNOW[id]=['y'|'n', timestamp] */
function migrateMist(m){const o={};(m||[]).forEach(id=>o[id]=['n',1]);return o}
let KNOW=null;try{KNOW=JSON.parse(localStorage.getItem('dictKnow')||'null')}catch(e){}
if(!KNOW){let m=[];try{m=JSON.parse(localStorage.getItem('dictMist')||'[]')}catch(e){}KNOW=migrateMist(m)}
const saveKnow=()=>{try{localStorage.setItem('dictKnow',JSON.stringify(KNOW))}catch(e){};dirty()};
try{if(!localStorage.getItem('dictKnow'))localStorage.setItem('dictKnow',JSON.stringify(KNOW))}catch(e){}
const kst=w=>(KNOW[w.id]||[])[0];
const isY=w=>kst(w)==='y', isN=w=>kst(w)==='n';
const known=isY;
function setKnow(id,v){if(v)KNOW[id]=[v,Date.now()];else delete KNOW[id];saveKnow()}
/* split a word's Hebrew into separate meanings (commas, semicolons, slashes outside parentheses) */
const MCACHE=new Map();
function meanings(w){if(MCACHE.has(w.id))return MCACHE.get(w.id);const out=[];
  w.h.forEach(part=>{let buf='',d=0;for(const ch of part){if('(['.includes(ch))d++;if(')]'.includes(ch))d--;if(',;/'.includes(ch)&&d===0){out.push(buf);buf=''}else buf+=ch}out.push(buf)});
  const r=[];out.forEach(x=>{x=x.trim();if(x&&!r.includes(x))r.push(x)});if(!r.length)r.push(w.h.join(' '));MCACHE.set(w.id,r);return r}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label=w=>w.h.join(' · ');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* speech */
const TTS='speechSynthesis' in window;if(!TTS)document.documentElement.classList.add('no-tts');
let voice=null;function pickVoice(){if(!TTS)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/Google|Samantha|Aria|Jenny|Natural/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,rate){if(!TTS)return;try{speechSynthesis.cancel();t=t.replace(/\s*\(.*?\)/g,'').replace(/…|\.\.\./g,', ').replace(/^\d+(st|nd|rd|th)\s*-\s*/,'').replace(/\s*-\s*10th$/,'');const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate||.85;speechSynthesis.speak(u)}catch(e){}}
function highlight(s,e){const toks=e.toLowerCase().match(/[a-z]+/g)||[];let out=esc(s);
  toks.filter(t=>t.length>1&&!['st','nd','rd','th','of','the','to','in','on','a'].includes(t)).forEach(t=>{const stem=t.length>4?t.slice(0,t.length-2):t;
    out=out.replace(new RegExp('\\b('+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[a-z]*)','i'),'<mark>$1</mark>')});return out}

/* state */
let S={screen:'home',l:1,g:0,mode:'read',active:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('dictNav2')||'{}'));if(!['home','level','group','words','quiz','cards'].includes(S.screen))S.screen='home'}catch(e){}
function persist(){try{localStorage.setItem('dictNav2',JSON.stringify({screen:S.screen,l:S.l,g:S.g,mode:S.mode,active:S.active}))}catch(e){}}
function go(patch){Object.assign(S,patch);persist();draw();window.scrollTo(0,0)}

function pickList(ws){return [...shuffle(ws.filter(w=>!isY(w))),...shuffle(ws.filter(isY))]}
function quizPanel(key,ws,title,name,from,noSet,cls){
  if(SESS[key]&&SESS[key].kind==='quiz'&&SESS[key].v!==2)delete SESS[key];
  const ss=SESS[key];
  if(ss){const n=ss.ids.length,at=Math.min(ss.i+1,n);
    return `<section class="panel ${cls||''}"><h3>${title}</h3>
      <p class="resume-info">עצרת ב${ss.mode==='listen'?'בוחן שמיעה':'בוחן קריאה'} במילה <b>${at} מתוך ${n}</b> · ידעת ${ss.score} עד עכשיו</p>
      <div class="bar2"><i style="width:${ss.i/n*100}%"></i></div>
      <button class="btn" data-resume="${key}">המשך מהמילה ${at}</button>
      <button class="link" data-restart="${key}">התחלה מחדש</button></section>`}
  return `<section class="panel ${cls||''}"><h3>${title}</h3>${noSet?'':settings()}<button class="btn" data-start="${key}">${noSet?'בוחן על המילים שאני לא יודעת':'התחלת בוחן'} · ${ws.length} מילים</button></section>`;
}
function bindQuizPanel(key,ws,name,from){

}

/* quiz-logic */
let Q=null;
const blankQ=()=>({stage:'write',mine:[],opts:null,sel:[],checked:false,shown:false,sent:false});
function startQuiz(list,name,from,key){if(!list.length)return;Q={key,list,i:0,score:0,pts:0,max:0,mist:[],name,from,l:S.l,g:S.g,mode:S.mode,...blankQ()};saveQ();S.active=key;go({screen:'quiz'});speak(list[0].e)}
function saveQ(){if(!Q)return;SESS[Q.key]={v:2,kind:'quiz',t:Date.now(),ids:ids(Q.list),i:Q.i,score:Q.score,pts:Q.pts,max:Q.max,mist:ids(Q.mist),name:Q.name,from:Q.from,l:Q.l,g:Q.g,mode:Q.mode,stage:Q.stage,mine:Q.mine,opts:Q.opts,sel:Q.sel,checked:Q.checked,shown:Q.shown,sent:Q.sent};saveSess()}
function loadQ(key){const s=SESS[key];if(!s||s.kind!=='quiz'||s.v!==2)return false;
  Q={key,list:objs(s.ids),i:s.i,score:s.score||0,pts:s.pts||0,max:s.max||0,mist:objs(s.mist||[]),name:s.name,from:s.from,l:s.l,g:s.g,mode:s.mode,...blankQ(),
    stage:s.stage||'write',mine:Array.isArray(s.mine)?s.mine:[],opts:s.opts||null,sel:s.sel||[],checked:!!s.checked,shown:!!s.shown,sent:!!s.sent};
  if(Q.stage==='pick'&&!Q.opts){Q.stage='write';Q.checked=false}return Q.i<Q.list.length}
function resumeQuiz(key){if(!loadQ(key)){delete SESS[key];saveSess();draw();return}S.l=Q.l;S.g=Q.g;S.active=key;go({screen:'quiz'});if(!Q.checked)speak(Q.list[Q.i].e)}
function buildOpts(w){const right=meanings(w),need=Math.max(2,4-right.length);
  const pool=shuffle(words.filter(x=>Math.abs(x.l-w.l)<=1&&x.e.toLowerCase()!==w.e.toLowerCase()&&!meanings(x).some(m=>right.includes(m))));
  const wrongs=[];for(const x of pool){const m=shuffle(meanings(x))[0];if(m&&!right.includes(m)&&!wrongs.includes(m))wrongs.push(m);if(wrongs.length>=need)break}
  return shuffle([...right.map(t=>[t,1]),...wrongs.map(t=>[t,0])])}
function quizScreen(){
  const w=Q.list[Q.i],n=Q.list.length,listen=Q.mode==='listen',M=meanings(w),nm=M.length;
  const showWord=!listen||Q.shown||Q.stage==='pick';
  const sentence=Q.sent||Q.checked?`<div class="sentence"><button class="spk sm" id="saySent" aria-label="השמעת המשפט">${SPK}</button><span dir="ltr">${showWord?highlight(w.s,w.e):esc(w.s)}</span></div>`:`<button class="link" id="showSent">הצגת משפט לדוגמה</button>`;
  const wordBox=showWord?`<div class="word"><span class="w">${esc(w.e)}</span><button class="spk" id="say" aria-label="השמעת המילה">${SPK}</button></div>`
    :`<div class="word listen"><button class="play" id="say" aria-label="השמעת המילה שוב">${SPK}<span>השמעה חוזרת</span></button><button class="link" id="reveal">הצגת המילה כתובה</button></div>`;
  let body='';
  if(Q.stage==='write'){
    body=`${sentence}
      <p class="ask">${listen?'מה שמעת? ':''}${nm>1?`למילה יש ${nm} פירושים. כתבי כמה שאת יודעת`:'מה הפירוש בעברית?'}</p>
      <div class="inps">${M.map((_,k)=>`<input class="inp" id="inp${k}" data-k="${k}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${k<nm-1?'next':'go'}" aria-label="פירוש ${k+1}" placeholder="${nm>1?`פירוש ${k+1}`:'כתבי כאן את הפירוש'}" value="${esc(Q.mine[k]||'')}">`).join('')}</div>
      <div class="sticky"><button class="btn" id="show">הצגת אפשרויות</button></div>`;
  }else{
    const mine=(Q.mine||[]).filter(x=>x&&x.trim());
    let fb='';
    if(Q.checked){const got=Q.sel.filter(k=>Q.opts[k][1]).length,bad=Q.sel.filter(k=>!Q.opts[k][1]).length;
      fb=`<p class="fb ${got===nm&&!bad?'ok':got?'part':'bad'}" role="status" aria-live="polite"><span class="frac">${got}/${nm}</span> ${got===nm?(nm>1?'כל הפירושים נכונים':'נכון!'):got?'מהפירושים הנכונים':'לא סימנת פירוש נכון'}${bad?` · סימנת ${bad===1?'פירוש שגוי אחד':bad+' פירושים שגויים'}`:''}</p>`}
    body=`<p class="mine"><span>מה שכתבת:</span> ${mine.length?mine.map(esc).join(' · '):'<span>(לא נכתב)</span>'}</p>
      ${Q.checked?'':`<p class="ask">${nm>1?`סמני את כל הפירושים הנכונים (${nm})`:'בחרי את הפירוש הנכון'}</p>`}
      <div class="opts">${Q.opts.map(([t,ok],k)=>{const on=Q.sel.includes(k);let c=on?' on':'',pre='';
        if(Q.checked){c='';if(ok&&on){c=' right';pre='✓ '}else if(ok){c=' missed';pre='✓ '}else if(on){c=' wrong';pre='✗ '}else c=' dim'}
        return `<button class="opt${c}" data-k="${k}" ${Q.checked?'disabled':''} aria-pressed="${on}">${pre}${esc(t)}${Q.checked&&ok&&!on?' <small>(לא סומן)</small>':''}</button>`}).join('')}</div>
      ${fb}
      ${sentence}
      <div class="sticky">${Q.checked?`<p class="ask center">ידעת את המילה?</p><div class="row2"><button class="btn knowno" id="markN">✗ לא ידעתי</button><button class="btn knowyes" id="markY">✓ ידעתי</button></div>`
        :`<button class="btn" id="check" ${Q.sel.length?'':'disabled'}>בדיקה</button>`}</div>`;
  }
  app.innerHTML=`<div class="screen full">
    <div class="qtop"><button class="x" id="exit" aria-label="יציאה מהבוחן">✕</button><div class="prog"><i style="width:${Q.i/n*100}%"></i></div><span class="count">${Q.i+1} / ${n}</span></div>
    <p class="mode-tag">${listen?'בוחן שמיעה':'בוחן קריאה'} · ${esc(Q.name)}</p>
    ${wordBox}
    ${body}
  </div>`;
  function keepInput(){if(Q.stage==='write')Q.mine=M.map((_,k)=>($('inp'+k)||{}).value||'')}
  $('exit').onclick=()=>{keepInput();saveQ();S.active=null;go({screen:Q.from})};
  $('say').onclick=()=>speak(w.e);
  const rv=$('reveal');if(rv)rv.onclick=()=>{keepInput();Q.shown=true;saveQ();draw()};
  const ss=$('showSent');if(ss)ss.onclick=()=>{keepInput();Q.sent=true;saveQ();draw();speak(w.s,.9)};
  const sy=$('saySent');if(sy)sy.onclick=()=>speak(w.s,.9);
  if(Q.stage==='write'){
    const show=()=>{keepInput();Q.opts=buildOpts(w);Q.sel=[];Q.stage='pick';saveQ();draw();if(listen)speak(w.e)};
    $('show').onclick=show;
    app.querySelectorAll('.inps .inp').forEach(inp=>{
      inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const nx=$('inp'+(+inp.dataset.k+1));if(nx)nx.focus();else show()}};
      inp.oninput=()=>{keepInput();clearTimeout(window._sv);window._sv=setTimeout(saveQ,400)}});
  }else if(!Q.checked){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
      if(nm===1)Q.sel=Q.sel.includes(k)?[]:[k];else Q.sel=Q.sel.includes(k)?Q.sel.filter(x=>x!==k):[...Q.sel,k];saveQ();draw()});
    $('check').onclick=()=>{Q.checked=true;const got=Q.sel.filter(k=>Q.opts[k][1]).length;Q.pts+=got;Q.max+=nm;saveQ();draw();
      const f=app.querySelector('.fb');f&&f.scrollIntoView({block:'nearest',behavior:'smooth'})};
  }else{
    const next=v=>{setKnow(w.id,v);if(v==='y')Q.score++;else Q.mist.push(w);Q.i++;
      if(Q.i>=n){delete SESS[Q.key];saveSess();S.active=null;go({screen:'result'});return}
      Object.assign(Q,blankQ());saveQ();draw();window.scrollTo(0,0);speak(Q.list[Q.i].e);if(Q.mode==='read'){const i=$('inp0');i&&i.focus({preventScroll:true})}};
    $('markY').onclick=()=>next('y');$('markN').onclick=()=>next('n');
  }
}
function result(){
  const done=Math.min(Q.i,Q.list.length),p=Q.max?Math.round(Q.pts/Q.max*100):0;
  app.innerHTML=`<div class="screen">
    <div class="center"><p class="sub" style="margin:0 0 10px">${esc(Q.name)}</p><div class="big">${Q.score}/${done}</div><p class="sub">מילים שידעת · ${Q.pts}/${Q.max} פירושים נכונים (${p}%)</p></div>
    ${Q.mist.length?`<button class="btn" id="retry">בוחן על ${Q.mist.length} המילים שלא ידעת</button>`:''}
    <button class="btn secondary" id="back">סיום</button>
    ${Q.mist.length?`<div><p class="lbl">מילים שסימנת "לא ידעתי"</p><ul class="mist">${Q.mist.map(w=>`<li><button class="spk sm" data-say="${esc(w.e)}" aria-label="השמעה">${SPK}</button><div class="txt"><span class="e">${esc(w.e)}</span><span class="h">${esc(label(w))}</span></div></li>`).join('')}</ul></div>`:''}
  </div>`;
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const r=$('retry');if(r)r.onclick=()=>{S.mode=Q.mode;startQuiz(shuffle(Q.mist),'חזרה · '+Q.name.replace('חזרה · ',''),Q.from,'R'+Q.key.replace(/^R/,''))};
  $('back').onclick=()=>{S.l=Q.l;S.g=Q.g;go({screen:Q.from})};
}

/* flashcards */
let C=null;
function saveC(){if(!C)return;if(C.i>=C.deck.length){delete SESS[C.key]}else{SESS[C.key]={kind:'cards',t:Date.now(),ids:ids(C.deck),i:C.i,l:S.l,g:S.g}}saveSess()}
function cardScreen(){
  const n=C.deck.length;
  if(C.i>=n){saveC();S.active=null;persist();app.innerHTML=`<div class="screen"><div class="center"><div class="big">✓</div><h2 style="margin-top:14px">סיימת את כל ${n} הכרטיסיות</h2></div><button class="btn" id="q">עכשיו לבוחן</button><button class="btn secondary" id="b">חזרה לקבוצה</button></div>`;
    $('q').onclick=()=>{go({screen:'group'});const b=app.querySelector('[data-start],[data-resume]');b&&b.click()};
    $('b').onclick=()=>go({screen:'group'});return}
  const w=C.deck[C.i];
  app.innerHTML=`<div class="screen full">
    <div class="qtop"><button class="x" id="exit" aria-label="יציאה">✕</button><div class="prog"><i style="width:${C.i/n*100}%"></i></div><span class="count">${C.i+1} / ${n}</span></div>
    <button class="card" id="card" aria-label="הפיכת הכרטיס"><span class="w">${esc(w.e)}</span>${C.open?`<span class="a">${w.h.map(esc).join('<br>')}</span><span class="ex" dir="ltr">${highlight(w.s,w.e)}</span>`:`<span class="hint">הקישי כדי לראות פירוש ומשפט</span>`}</button>
    <div class="sticky"><div class="row2"><button class="btn secondary" id="say">${SPK} מילה</button><button class="btn secondary" id="saySent">${SPK} משפט</button></div>
    <div class="row2"><button class="btn secondary" id="prev" ${C.i?'':'disabled'}>הקודם</button><button class="btn" id="nxt">הבא</button></div></div>
  </div>`;
  $('exit').onclick=()=>{saveC();S.active=null;go({screen:'group'})};
  $('card').onclick=()=>{C.open=!C.open;draw()};
  $('say').onclick=()=>speak(w.e);
  $('saySent').onclick=()=>speak(w.s,.9);
  $('prev').onclick=()=>{C.i--;C.open=false;saveC();draw();speak(C.deck[C.i].e)};
  $('nxt').onclick=()=>{C.i++;C.open=false;saveC();draw();if(C.deck[C.i])speak(C.deck[C.i].e)};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.screen==='quiz'||S.screen==='cards'))$('exit')?.click()});
(function boot(){
  if(S.screen==='quiz'){if(!(S.active&&loadQ(S.active)))S.screen=S.active&&S.active.startsWith('L')?'level':'home'}
  if(S.screen==='cards'){const ss=S.active&&SESS[S.active];if(ss&&ss.kind==='cards'){C={key:S.active,deck:objs(ss.ids),i:ss.i,open:false}}else S.screen='group'}
  draw();
  syncNow(false);
})();
</script>
