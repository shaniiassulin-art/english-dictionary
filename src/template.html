html,body{height:100%}
button,.item,.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.screen.full{min-height:calc(100dvh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

    return `<section class="panel ${cls||''}"><h3>${title}</h3>

      <div class="bar2"><i style="width:${ss.i/n*100}%"></i></div>
      <button class="btn" data-resume="${key}">המשך מהמילה ${at}</button>
      <button class="link" data-restart="${key}">התחלה מחדש</button></section>`}

function bindQuizPanel(key,ws,name,from){

  const rr=app.querySelector(`[data-restart="${key}"]`);if(rr)rr.onclick=()=>{(SDEL[key]=Date.now(),delete SESS[key]);saveSess();draw()};
}

/* quiz-logic */
let Q=null;
const blankQ=()=>({stage:'write',mine:[],opts:null,sel:[],checked:false,shown:false,sent:false});
/* outside voice mode words are read only when a speaker button is pressed, except in the listening quiz, where the word is hidden */
function autoSay(){if(Q&&Q.mode==='listen'&&!V.on&&Q.list[Q.i])speak(Q.list[Q.i].e)}
function startQuiz(list,name,from,key){if(!list.length)return;Q={key,list,i:0,score:0,pts:0,max:0,mist:[],marks:{},rv:null,name,from,l:S.l,g:S.g,mode:S.mode,...blankQ()};saveQ();S.active=key;go({screen:'quiz'});autoSay()}
function saveQ(){if(!Q)return;SESS[Q.key]={v:2,kind:'quiz',t:Date.now(),ids:ids(Q.list),i:Q.i,score:Q.score,pts:Q.pts,max:Q.max,mist:ids(Q.mist),marks:Q.marks||{},name:Q.name,from:Q.from,l:Q.l,g:Q.g,mode:Q.mode,stage:Q.stage,mine:Q.mine,opts:Q.opts,sel:Q.sel,checked:Q.checked,shown:Q.shown,sent:Q.sent};saveSess()}
function loadQ(key){const s=SESS[key];if(!s||s.kind!=='quiz'||s.v!==2)return false;
  Q={key,list:objs(s.ids),i:s.i,score:s.score||0,pts:s.pts||0,max:s.max||0,mist:objs(s.mist||[]),marks:s.marks||{},rv:null,name:s.name,from:s.from,l:s.l,g:s.g,mode:s.mode,...blankQ(),
    stage:s.stage||'write',mine:Array.isArray(s.mine)?s.mine:[],opts:s.opts||null,sel:s.sel||[],checked:!!s.checked,shown:!!s.shown,sent:!!s.sent};
  if(Q.stage==='pick'&&!Q.opts){Q.stage='write';Q.checked=false}return Q.i<Q.list.length}
function resumeQuiz(key){if(!loadQ(key)){(SDEL[key]=Date.now(),delete SESS[key]);saveSess();draw();return}S.l=Q.l;S.g=Q.g;S.active=key;go({screen:'quiz'});if(!Q.checked)autoSay()}
/* the correct meanings plus ONE wrong meaning that looks or sounds close, to make it confusing */
const bigr=t=>{t=String(t).toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-zא-ת]/g,'');const b=new Set();for(let i=0;i<t.length-1;i++)b.add(t.slice(i,i+2));return b};
const jac=(a,b)=>{if(!a.size||!b.size)return 0;let n=0;a.forEach(x=>{if(b.has(x))n++});return n/(a.size+b.size-n)};
/* meanings that say the same thing: their parts appear together on one dictionary line (e.g. "מצב, מעמד") */
const mparts=m=>String(m).replace(/[\u0591-\u05C7]/g,'').replace(/\([^)]*\)/g,'').split(/[,;\/]/).map(x=>x.replace(/[-־'"״׳.]/g,'').replace(/\s+/g,' ').trim()).filter(x=>x.length>1);
const SYN=(()=>{const g=new Map();for(const r of RAW)for(const m of r.h){const ps=mparts(m);for(const p of ps){if(!g.has(p))g.set(p,new Set());ps.forEach(q=>g.get(p).add(q))}}return g})();
function synOf(right){const syn=new Set();right.forEach(r=>mparts(r).forEach(p=>{syn.add(p);(SYN.get(p)||[]).forEach(q=>syn.add(q))}));const arr=[...syn];return{syn,arr,sb:arr.map(bigr)}}
/* at most one letter apart (הודות / תודות) */
function near1(a,b){if(a===b)return true;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;let i=0,j=0,d=0;
  while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;continue}if(++d>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++}}return d+(la-i)+(lb-j)<=1}
function sameMeaning(m,S){return mparts(m).some(p=>S.syn.has(p)||S.arr.some(q=>near1(p,q))||S.arr.some(q=>q.length>2&&p.length>2&&(p.includes(q)||q.includes(p)))||S.sb.some(b=>jac(b,bigr(p))>=.7))}
function buildOpts(w){const right=meanings(w),rb=right.map(bigr),eb=bigr(w.e),parts=right.join(',').split(/[,;\/]/).map(x=>x.trim()).filter(Boolean);
  const cands=[],SY=synOf(right);
  for(const x of words){if(x===w||x.e.toLowerCase()===w.e.toLowerCase())continue;const xm=meanings(x);
    if(xm.some(m=>right.includes(m)))continue;
    const es=jac(eb,bigr(x.e));
    for(const m of xm){if(parts.some(p=>m.includes(p))||(w.others||[]).includes(m)||sameMeaning(m,SY))continue;
      const hs=Math.max(...rb.map(b=>jac(b,bigr(m))));if(hs>.75)continue;cands.push([m,hs+es*.25+(Math.abs(x.l-w.l)<=1?.05:0)])}}
  cands.sort((a,b)=>b[1]-a[1]);
  const top=cands.slice(0,6);const wrong=(top[Math.floor(Math.random()*top.length)]||['—'])[0];
  return shuffle([...right.map(t=>[t,1]),[wrong,0]])}
/* ---------- quiz actions (shared by touch and voice) ---------- */
function qShow(){const w=Q.list[Q.i];Q.opts=buildOpts(w);Q.sel=[];Q.stage='pick';saveQ();draw()}
function qCheck(){const nm=meanings(Q.list[Q.i]).length;Q.checked=true;const got=Q.sel.filter(k=>Q.opts[k][1]).length,bad=Q.sel.filter(k=>!Q.opts[k][1]).length;
  Q.pts+=got;Q.max+=nm;saveQ();draw();const f=app.querySelector('.fb');f&&f.scrollIntoView({block:'nearest',behavior:'smooth'});return{got,bad,nm}}
function qMark(v){const w=Q.list[Q.i],n=Q.list.length;setKnow(w.id,v);Q.marks=Q.marks||{};Q.marks[w.id]=v;if(v==='y')Q.score++;else Q.mist.push(w);Q.i++;
  if(Q.i>=n){(SDEL[Q.key]=Date.now(),delete SESS[Q.key]);saveSess();S.active=null;stopVoice(true);go({screen:'result'});return true}
  Object.assign(Q,blankQ());saveQ();draw();window.scrollTo(0,0);
  if(!V.on){autoSay();if(Q.mode==='read'){const i=$('inp0');i&&i.focus({preventScroll:true})}}
  return false}

/* ---------- voice mode: the app reads everything aloud and listens for answers ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>';
let V={on:false,token:0,status:'',lock:null,ac:null,miss:0};
function setStatus(t){V.status=t;const el=$('vbarTxt');if(el)el.textContent=t}
/* iOS: speech only plays if the first utterance starts inside the tap, never right after cancel(), and not while the mic is still closing */
function sayNow(text,lang,res){try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.volume=1;if(lang!=='he-IL'&&voice)u.voice=voice;u.rate=lang==='he-IL'?1:.85;
    let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,text.length*300+5000);speechSynthesis.speak(u)}catch(e){res()}}
async function say(text,lang){if(!text)return;
  /* give the phone time to switch from the microphone back to the speaker, or the start of the speech is cut */
  const gap=800-(Date.now()-(V.micOff||0));if(gap>0)await wait(gap);playbackSession();if(V.on)keepAlive(true);await waitQuiet();
  /* English word or sentence: recorded file (audible even on silent); Hebrew and missing files: device voice */
  if(lang==='en-US'&&(await playFile(WORDSET.has(text)?'w':'s',text))!==false)return;
  if(!TTS)return;
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();await wait(150)}
  return new Promise(res=>sayNow(text,lang,res))}
/* wait until nothing is speaking (iOS sometimes reports the end of speech early) */
async function waitQuiet(){const t0=Date.now();while(Date.now()-t0<15000){
  const sp=TTS&&(speechSynthesis.speaking||speechSynthesis.pending),au=AU.el&&!AU.el.paused&&!AU.el.ended;if(!sp&&!au)return;await wait(100)}}
/* let the last words finish before the microphone opens (opening it cuts the sound) */
async function ask(ms){await waitQuiet();await wait(500);if(!V.on)return[];beep();await wait(200);return listen(ms)}
function beep(){try{const ac=V.ac;if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch(e){}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function listen(ms){return new Promise(res=>{let r;try{r=new SR()}catch(e){res([]);return}
  try{if(navigator.audioSession)navigator.audioSession.type='auto'}catch(e){}
  r.lang='he-IL';r.interimResults=true;r.maxAlternatives=3;r.continuous=false;let alts=[],done=false;
  const fin=()=>{if(done)return;done=true;clearTimeout(t);try{r.abort()}catch(e){}V.micOff=Date.now();playbackSession();res(alts)};
  r.onresult=e=>{const last=e.results[e.results.length-1];alts=[...last].map(a=>a.transcript.trim()).filter(Boolean);if(alts[0])setStatus('שמעתי: '+alts[0]);if(last.isFinal)fin()};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')V.denied=true;fin()};
  r.onend=fin;const t=setTimeout(fin,ms||9000);setStatus('מקשיבה… דברי עכשיו');try{r.start()}catch(e){fin()}})}
const vnorm=t=>String(t||'').toLowerCase().replace(/[֑-ׇ]/g,'').replace(/[.,!?;:"'״׳()\-–]/g,' ').replace(/\s+/g,' ').trim();
const vwords=t=>vnorm(t).split(' ').filter(Boolean);
const isStop=t=>vwords(t).some(w=>['עצור','עצרי','הפסק','הפסיקי','סטופ','stop'].includes(w));
const isRepeat=t=>{const n=vnorm(t);return /(^| )(חזור|חזרי|תחזור|תחזרי|שוב)( |$)/.test(n)||n.includes('עוד פעם')};
const NUM={'אחת':1,'אחד':1,'ראשונה':1,'ראשון':1,'שתיים':2,'שתים':2,'שניים':2,'שנים':2,'שתי':2,'שנייה':2,'שניה':2,'שני':2,'שלוש':3,'שלש':3,'שלושה':3,'שלישית':3,'שלישי':3,
  'ארבע':4,'ארבעה':4,'רביעית':4,'רביעי':4,'חמש':5,'חמישה':5,'חמישית':5,'חמישי':5,'שש':6,'שישה':6,'שישית':6,'שישי':6,'שבע':7,'שבעה':7,'שביעית':7,'שביעי':7,'שמונה':8,'שמינית':8};
function parseSel(alts,opts){
  for(const a of alts){const n=vnorm(a),found=new Set();
    (n.match(/\d+/g)||[]).forEach(d=>d.split('').forEach(c=>found.add(+c)));
    n.split(' ').forEach(w=>{for(const c of [w,w.replace(/^ו/,''),w.replace(/^ה/,''),w.replace(/^וה/,'')])if(NUM[c]){found.add(NUM[c]);break}});
    const nums=[...found].filter(k=>k>=1&&k<=opts.length).map(k=>k-1);
    if(nums.length)return nums.sort((x,y)=>x-y);
    const byText=[];opts.forEach(([t],k)=>{if(t.split(' / ').some(p=>{const q=vnorm(p);return q.length>1&&n.includes(q)}))byText.push(k)});
    if(byText.length)return byText}
  return null}
function startVoice(){
  if(!SR){V.on=false;setStatus('');draw();alertBar('זיהוי דיבור לא נתמך בדפדפן הזה. נסי לפתוח את האתר ב־Safari או ב־Chrome.');return}

  V.on=true;V.denied=false;V.miss=0;S.voice=true;persist();
  try{V.ac=V.ac||new (window.AudioContext||window.webkitAudioContext)();V.ac.resume&&V.ac.resume()}catch(e){}
  try{if(navigator.wakeLock&&!V.lock)navigator.wakeLock.request('screen').then(l=>V.lock=l).catch(()=>{})}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
  draw();
  /* first utterance must start synchronously inside the tap, or iOS keeps the voice silent */
  sayNow('מצב קולי פועל','he-IL',()=>{if(V.on)voiceLoop()});
}
function stopVoice(silent){V.on=false;V.token++;S.voice=false;persist();stopAudio();keepAlive(false);try{speechSynthesis.cancel()}catch(e){}
  try{V.lock&&V.lock.release()}catch(e){}V.lock=null;setStatus('');if(!silent&&S.screen==='quiz')draw()}
function alertBar(t){const el=$('vmsg');if(el){el.textContent=t;el.hidden=false}}
async function voiceLoop(){
  const tk=++V.token;const alive=()=>V.on&&V.token===tk&&S.screen==='quiz'&&Q&&Q.i<Q.list.length;
  const miss=async()=>{V.miss++;if(V.miss>=3){await say('לא שמעתי תשובה. עצרתי. לחצי על המיקרופון כדי להמשיך','he-IL');stopVoice();return true}return false};
  while(alive()){
    if(V.denied){stopVoice();alertBar('אין הרשאה למיקרופון. אשרי גישה למיקרופון בהגדרות הדפדפן ונסי שוב.');return}
    const w=Q.list[Q.i],nm=meanings(w).length,snap=()=>Q.i+'|'+Q.stage+'|'+Q.checked,s0=snap();
    if(Q.stage==='write'){
      setStatus('מקריאה את המילה');await say(w.e,'en-US');if(!alive())return;
      /* example sentence right after the word (and show it on screen) */
      if(w.s){if(!Q.sent){Q.sent=true;saveQ();draw()}setStatus('מקריאה משפט לדוגמה');await wait(300);await say(w.s,'en-US');if(!alive())return}
      /* the same text that is written above the answer box */
      if(w.others.length){setStatus('מקריאה את הפירושים האחרים');await say('פירושים אחרים של המילה: '+w.others.map((o,i)=>(i+1)+': '+o.replace(/ \/ /g,', ')).join('. ')+'. מה הפירוש הנוסף?','he-IL');if(!alive())return}
      const a=await ask(9000);if(!alive())return;if(snap()!==s0)continue;const t=a[0]||'';
      if(isStop(t)){stopVoice();return}
      if(isRepeat(t))continue;
      if(!t&&!(await miss()))continue;if(!V.on)return;
      V.miss=0;Q.mine=t?[t]:[];qShow();continue;
    }
    if(!Q.checked){
      const txt=Q.opts.map(([o],k)=>`${k+1}: ${o.replace(/ \/ /g,', ')}`).join('. ');
      setStatus('מקריאה את האפשרויות');await say((nm>1?`בחרי ${nm} תשובות. `:'')+txt,'he-IL');if(!alive())return;
      let sel=null,again=false;
      for(let tries=0;tries<3&&alive();tries++){const a=await ask(10000);if(!alive())return;if(snap()!==s0){again=true;break}
        if(isStop(a[0]||'')){stopVoice();return}
        if(isRepeat(a[0]||'')){again=true;break}
        sel=parseSel(a,Q.opts);if(sel)break;
        if(!a.length){if(await miss())return;if(!V.on)return}
        await say('לא הבנתי. אמרי את מספר התשובה','he-IL');if(!alive())return}
      if(again)continue;
      V.miss=0;Q.sel=sel||[];const r=qCheck();
      const right=Q.opts.filter(o=>o[1]).map(o=>o[0].replace(/ \/ /g,', '));
      const fb=r.got===nm&&!r.bad?'נכון!':`${r.got} מתוך ${nm}. ${nm>1?'התשובות הנכונות':'התשובה הנכונה'}: ${right.join('. ')}`;
      setStatus('');await say(fb+'. ידעת את המילה?','he-IL');continue;
    }
    const a=await ask(8000);if(!alive())return;if(snap()!==s0)continue;const t=vnorm(a.join(' '));
    if(isStop(t)){stopVoice();return}
    if(isRepeat(t)){await say('ידעת את המילה? אמרי ידעתי או לא ידעתי','he-IL');continue}
    let v=null;if(/(^| )(לא|no)( |$)/.test(t)||t.includes('לא ידעתי'))v='n';else if(/ידעתי|יודעת|כן|ידעת|yes/.test(t))v='y';
    if(!v){if(!a.length&&await miss())return;if(!V.on)return;await say('אמרי ידעתי או לא ידעתי','he-IL');continue}
    V.miss=0;if(qMark(v)){await say('סיימת את הבוחן. כל הכבוד','he-IL');return}
  }
}

/* go back to earlier words of this quiz and change ידעתי / לא ידעתי */
function reMark(w,v){Q.marks=Q.marks||{};const old=Q.marks[w.id]||kst(w);if(old===v)return;setKnow(w.id,v);Q.marks[w.id]=v;
  if(v==='y'){if(old==='n')Q.mist=Q.mist.filter(x=>x.id!==w.id);Q.score++}else{if(old==='y')Q.score=Math.max(0,Q.score-1);if(!Q.mist.some(x=>x.id===w.id))Q.mist.push(w)}
  saveQ();draw()}
function reviewScreen(){
  const k=Q.rv,w=Q.list[k],n=Q.list.length,m=(Q.marks||{})[w.id]||kst(w);
  app.innerHTML=`<div class="screen qz">
    <div class="qtop"><button class="x" id="back" aria-label="חזרה לבוחן">✕</button><div class="prog"><i style="width:${Q.i/n*100}%"></i></div><span class="count">${k+1} / ${n}</span></div>
    <p class="mode-tag">מילה קודמת · אפשר לשנות אם ידעת</p>
    <div class="word"><span class="w">${esc(w.e)}</span><button class="spk" id="say" aria-label="השמעת המילה">${SPK}</button></div>
    <div class="rv-ans"><span class="lbl">הפירוש שנשאלת עליו</span><b>${esc(label(w))}</b></div>
    ${w.others.length?`<div class="others sm">פירושים אחרים:${numList(w.others)}</div>`:''}
    <p class="rv-now">סימנת: <b class="${m==='y'?'kn':'unk'}">${m==='y'?'✓ ידעתי':m==='n'?'✗ לא ידעתי':'—'}</b></p>
    <div class="sticky"><div class="row2"><button class="btn knowno" id="markN" aria-pressed="${m==='n'}">✗ לא ידעתי</button><button class="btn knowyes" id="markY" aria-pressed="${m==='y'}">✓ ידעתי</button></div>
      <div class="row2"><button class="btn secondary" id="prev" ${k>0?'':'disabled'}>→ מילה קודמת</button><button class="btn secondary" id="ret">חזרה למילה הנוכחית</button></div></div>
  </div>`;
  $('say').onclick=()=>speak(w.e);
  $('markY').onclick=()=>reMark(w,'y');$('markN').onclick=()=>reMark(w,'n');
  $('prev').onclick=()=>{if(Q.rv>0){Q.rv--;draw()}};
  const ret=()=>{Q.rv=null;draw()};$('ret').onclick=ret;$('back').onclick=ret;
}
function quizScreen(){
  if(Q.rv!=null&&Q.rv<Q.i)return reviewScreen();Q.rv=null;
  const w=Q.list[Q.i],n=Q.list.length,listen=Q.mode==='listen',M=meanings(w),nm=M.length;
  const showWord=!listen||Q.shown||Q.stage==='pick';
  const sentence=Q.sent||Q.checked?`<div class="sentence"><button class="spk sm" id="saySent" aria-label="השמעת המשפט">${SPK}</button><span dir="ltr">${showWord?highlight(w.s,w.e):esc(w.s)}</span></div>`:`<button class="link" id="showSent">הצגת משפט לדוגמה</button>`;
  const wordBox=showWord?`<div class="word"><span class="w">${esc(w.e)}</span><button class="spk" id="say" aria-label="השמעת המילה">${SPK}</button></div>`
    :`<div class="word listen"><button class="play" id="say" aria-label="השמעת המילה שוב">${SPK}<span>השמעה חוזרת</span></button><button class="link" id="reveal">הצגת המילה כתובה</button></div>`;
  let body='';
  if(Q.stage==='write'){
    body=`${sentence}
      ${w.others.length?`<div class="others">פירושים אחרים של המילה:${numList(w.others)}מה הפירוש הנוסף?</div>`:''}
      ${listen&&!w.others.length?`<p class="ask">מה שמעת?</p>`:''}
      <div class="inps">${M.map((_,k)=>`<input class="inp" id="inp${k}" data-k="${k}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${k<nm-1?'next':'go'}" aria-label="פירוש ${k+1}" placeholder="${nm>1?`פירוש ${k+1}`:'כתבי כאן את הפירוש'}" value="${esc(Q.mine[k]||'')}">`).join('')}</div>
      <div class="sticky"><button class="btn" id="show">הצגת אפשרויות</button></div>`;
  }else{
    const mine=(Q.mine||[]).filter(x=>x&&x.trim());
    let fb='';
    if(Q.checked){const got=Q.sel.filter(k=>Q.opts[k][1]).length,bad=Q.sel.filter(k=>!Q.opts[k][1]).length;
      fb=`<p class="fb ${got===nm&&!bad?'ok':got?'part':'bad'}" role="status" aria-live="polite"><span class="frac">${got}/${nm}</span> ${got===nm?(nm>1?'כל הפירושים נכונים':'נכון!'):got?'מהפירושים הנכונים':'לא סימנת פירוש נכון'}${bad?` · סימנת ${bad===1?'פירוש שגוי אחד':bad+' פירושים שגויים'}`:''}</p>`}
    body=`${w.others.length?`<div class="others sm">פירושים אחרים:${numList(w.others)}</div>`:''}<p class="mine"><span>מה שכתבת:</span> ${mine.length?mine.map(esc).join(' · '):'<span>(לא נכתב)</span>'}</p>
      ${Q.checked?'':`<p class="ask">${nm>1?`סמני את כל הפירושים הנכונים (${nm})`:'בחרי את הפירוש הנכון'}</p>`}
      <div class="opts">${Q.opts.map(([t,ok],k)=>{const on=Q.sel.includes(k);let c=on?' on':'',pre='';
        if(Q.checked){c='';if(ok&&on){c=' right';pre='✓ '}else if(ok){c=' missed';pre='✓ '}else if(on){c=' wrong';pre='✗ '}else c=' dim'}
        return `<button class="opt${c}" data-k="${k}" ${Q.checked?'disabled':''} aria-pressed="${on}">${pre}${esc(t)}${Q.checked&&ok&&!on?' <small>(לא סומן)</small>':''}</button>`}).join('')}</div>
      ${fb}
      ${sentence}
      <div class="sticky">${Q.checked?`<div class="row2"><button class="btn knowno" id="markN">✗ לא ידעתי</button><button class="btn knowyes" id="markY">✓ ידעתי</button></div>`
        :`<button class="btn" id="check" ${Q.sel.length?'':'disabled'}>בדיקה</button>`}</div>`;
  }
  app.innerHTML=`<div class="screen qz">
    <div class="qtop"><button class="x" id="exit" aria-label="יציאה מהבוחן">✕</button><div class="prog"><i style="width:${Q.i/n*100}%"></i></div><span class="count">${Q.i+1} / ${n}</span><button class="mic${V.on?' on':''}" id="voiceBtn" aria-pressed="${V.on}" aria-label="${V.on?'עצירת מצב קולי':'מצב קולי'}">${MIC}</button></div>
    <p class="vmsg" id="vmsg" hidden></p>
    <p class="mode-tag">${listen?'שמיעה':'קריאה'} · ${esc(Q.name)}${Q.i>0?` · <button class="link inl" id="goPrev">→ למילה הקודמת</button>`:''}</p>
    ${wordBox}
    ${body}
    ${V.on?`<div class="vbar" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="vbarTxt">${esc(V.status||'מצב קולי פעיל')}</span><button class="vstop" id="vstop">עצירה</button></div>`:''}
  </div>`;
  $('voiceBtn').onclick=()=>{if(V.on)stopVoice();else startVoice()};
  const gp=$('goPrev');if(gp)gp.onclick=()=>{keepInput();stopVoice(true);saveQ();Q.rv=Q.i-1;draw()};
  const vs=$('vstop');if(vs)vs.onclick=()=>stopVoice();
  function keepInput(){if(Q.stage==='write')Q.mine=M.map((_,k)=>($('inp'+k)||{}).value||'')}
  $('exit').onclick=()=>{keepInput();stopVoice(true);saveQ();S.active=null;go({screen:Q.from})};
  $('say').onclick=()=>speak(w.e);
  const rv=$('reveal');if(rv)rv.onclick=()=>{keepInput();Q.shown=true;saveQ();draw()};
  const ss=$('showSent');if(ss)ss.onclick=()=>{keepInput();Q.sent=true;saveQ();draw()};
  const sy=$('saySent');if(sy)sy.onclick=()=>speak(w.s,.9);
  if(Q.stage==='write'){
    const show=()=>{keepInput();qShow()};
    $('show').onclick=show;
    app.querySelectorAll('.inps .inp').forEach(inp=>{
      inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const nx=$('inp'+(+inp.dataset.k+1));if(nx)nx.focus();else show()}};
      inp.oninput=()=>{keepInput();clearTimeout(window._sv);window._sv=setTimeout(saveQ,400)}});
  }else if(!Q.checked){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
      if(nm===1)Q.sel=Q.sel.includes(k)?[]:[k];else Q.sel=Q.sel.includes(k)?Q.sel.filter(x=>x!==k):[...Q.sel,k];saveQ();draw()});
    $('check').onclick=()=>qCheck();
  }else{
    $('markY').onclick=()=>qMark('y');$('markN').onclick=()=>qMark('n');
  }
}
function result(){
  const done=Math.min(Q.i,Q.list.length),p=Q.max?Math.round(Q.pts/Q.max*100):0;
  app.innerHTML=`<div class="screen">
    <div class="center"><p class="sub" style="margin:0 0 10px">${esc(Q.name)}</p><div class="big">${Q.score}/${done}</div><p class="sub">מילים שידעת · ${Q.pts}/${Q.max} פירושים נכונים (${p}%)</p></div>
    ${Q.mist.length?`<button class="btn" id="retry">בוחן על ${Q.mist.length} המילים שלא ידעת</button>`:''}
    <button class="btn secondary" id="back">סיום</button>
    ${Q.mist.length?`<div><p class="lbl">מילים שסימנת "לא ידעתי"</p><ul class="mist">${Q.mist.map(w=>`<li><button class="spk sm" data-say="${esc(w.e)}" aria-label="השמעה">${SPK}</button><div class="txt"><span class="e">${esc(w.e)}</span><span class="h">${esc(label(w))}</span></div></li>`).join('')}</ul></div>`:''}
  </div>`;
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const r=$('retry');if(r)r.onclick=()=>{S.mode=Q.mode;startQuiz(shuffle(Q.mist),'חזרה · '+Q.name.replace('חזרה · ',''),Q.from,'R'+Q.key.replace(/^R/,''))};
  $('back').onclick=()=>{S.l=Q.l;S.g=Q.g;go({screen:Q.from})};
}

/* flashcards */
let C=null;
function saveC(){if(!C)return;if(C.i>=C.deck.length){(SDEL[C.key]=Date.now(),delete SESS[C.key])}else{SESS[C.key]={kind:'cards',t:Date.now(),ids:ids(C.deck),i:C.i,l:S.l,g:S.g}}saveSess()}
function cardScreen(){
  const n=C.deck.length;
  if(C.i>=n){saveC();S.active=null;persist();app.innerHTML=`<div class="screen"><div class="center"><div class="big">✓</div><h2 style="margin-top:14px">סיימת את כל ${n} הכרטיסיות</h2></div><button class="btn" id="q">עכשיו לבוחן</button><button class="btn secondary" id="b">חזרה לקבוצה</button></div>`;
    $('q').onclick=()=>{go({screen:'group'});const b=app.querySelector('[data-start],[data-resume]');b&&b.click()};
    $('b').onclick=()=>go({screen:'group'});return}
  const w=C.deck[C.i];
  app.innerHTML=`<div class="screen full">
    <div class="qtop"><button class="x" id="exit" aria-label="יציאה">✕</button><div class="prog"><i style="width:${C.i/n*100}%"></i></div><span class="count">${C.i+1} / ${n}</span></div>
    <button class="card" id="card" aria-label="הפיכת הכרטיס"><span class="w">${esc(w.e)}</span>${C.open?`<span class="a">${w.h.map(esc).join('<br>')}</span>${w.others.length?`<span class="oth">פירושים נוספים: ${esc(numText(w.others))}</span>`:''}<span class="ex" dir="ltr">${highlight(w.s,w.e)}</span>`:`<span class="hint">הקישי כדי לראות פירוש ומשפט</span>`}</button>
    <div class="sticky"><div class="row2"><button class="btn secondary" id="say">${SPK} מילה</button><button class="btn secondary" id="saySent">${SPK} משפט</button></div>
    <div class="row2"><button class="btn secondary" id="prev" ${C.i?'':'disabled'}>הקודם</button><button class="btn" id="nxt">הבא</button></div></div>
  </div>`;
  $('exit').onclick=()=>{saveC();S.active=null;go({screen:'group'})};
  $('card').onclick=()=>{C.open=!C.open;draw()};
  $('say').onclick=()=>speak(w.e);
  $('saySent').onclick=()=>speak(w.s,.9);
  $('prev').onclick=()=>{C.i--;C.open=false;saveC();draw()};
  $('nxt').onclick=()=>{C.i++;C.open=false;saveC();draw()};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.screen==='quiz'||S.screen==='cards'))$('exit')?.click()});
(function boot(){
  if(S.screen==='quiz'){if(!(S.active&&loadQ(S.active)))S.screen=S.active&&S.active.startsWith('L')?'level':'home'}
  if(S.screen==='cards'){const ss=S.active&&SESS[S.active];if(ss&&ss.kind==='cards'){C={key:S.active,deck:objs(ss.ids),i:ss.i,open:false}}else S.screen='group'}
  draw();
  syncNow(false);
})();
</script>
